<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>塾バイト給料カレンダー</title>
<style>
*{box-sizing:border-box}
button,.day,.slot{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#111;transition:background .2s,color .2s}
body.dark{background:#111827;color:#f9fafb}
body.dark .summary,
body.dark .calendar,
body.dark .controls{background:#1f2937}
body.dark .day{background:#1f2937;color:#f9fafb;border-color:#374151}
body.dark .blank{background:#111827;border-color:#374151}
body.dark .week div{color:#d1d5db;border-color:#374151}
body.dark .entry{color:#d1d5db}
body.dark .preview{background:#111827}
body.dark .slot{background:#111827;color:#f9fafb;border-color:#4b5563}
body.dark .slot.active{background:#f9fafb;color:#111827;border-color:#f9fafb}
body.dark .head button,
body.dark .clear{background:#374151;color:#f9fafb}
body.dark .day.selected-day{background:#26324a}
.theme-btn{border:0;background:#eef0f4;color:#111;width:38px;height:32px;border-radius:10px;font-size:16px;font-weight:700}
body.dark .theme-btn{background:#374151;color:#f9fafb}
.wrap{max-width:760px;margin:auto;padding:10px 10px 24px}
h1{font-size:22px;margin:2px 0 8px}
.summary{background:#fff;border-radius:16px;padding:11px 14px;margin-bottom:9px}
.big{font-size:27px;font-weight:800;white-space:nowrap}
.sub{font-size:13px;color:#666}
.calendar{background:#fff;border-radius:16px;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;padding:7px 10px}
.head button{border:0;background:#eef0f4;width:36px;height:32px;border-radius:10px;font-size:20px;font-weight:700}
.month{font-size:18px;font-weight:800}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.week div{text-align:center;padding:4px 0;font-size:11px;color:#666;border-top:1px solid #eee}
.day,.blank{min-height:58px;border:0;border-top:1px solid #eee;border-right:1px solid #eee;background:#fff;text-align:left;padding:4px}
.day:nth-child(7n),.blank:nth-child(7n){border-right:0}
.blank{background:#fafafa}
.daynum{font-weight:700}
.entry{display:block;font-size:10px;margin-top:3px;font-weight:700;line-height:1.15;white-space:nowrap;color:#555}
.payday{display:block;font-size:9px;margin-top:2px;font-weight:800;color:#b45309}
.controls{background:#fff;border-radius:16px;padding:11px 12px;margin-top:9px}
#selected{font-weight:700;margin-bottom:12px}
.slot-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px}
.slot{
  border:1px solid #d7dbe0;background:#fff;border-radius:10px;padding:9px 3px;
  font-size:17px;font-weight:800;cursor:pointer
}
.slot.active{background:#111;color:#fff;border-color:#111}
.preview{background:#f7f7f8;border-radius:12px;padding:8px 10px;margin:7px 0 8px}
.preview .p1{font-size:13px;color:#666}
.preview .p2{font-size:22px;font-weight:800;margin-top:3px;white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{font-size:16px;padding:12px;border:0;border-radius:12px}
.save{background:#111;color:#fff}
.clear{background:#eee}
.note{font-size:12px;color:#666;margin-top:10px;line-height:1.5}
.today .daynum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#111;color:#fff}
.day.selected-day{background:#e8eefc;box-shadow:inset 0 0 0 2px #3157a4}
.day.selected-day .daynum{color:#24478f;font-weight:900}
.day.today.selected-day .daynum{
  background:#111;
  color:#fff;
  box-shadow:0 0 0 2px #fff, 0 0 0 4px #3157a4;
}
@media (max-width:480px){
  .wrap{padding:7px 7px 18px}
  h1{font-size:19px;margin:0 0 6px}
  .summary{padding:8px 11px;margin-bottom:7px}
  .summary .big{font-size:24px}
  .summary .sub{font-size:11px}
  .head{padding:5px 7px}
  .month{font-size:16px}
  .head button{width:34px;height:28px}
  .week div{padding:3px 0;font-size:10px}
  .day,.blank{min-height:51px;padding:3px}
  .daynum{font-size:11px}
  .entry{font-size:8.5px;margin-top:2px;line-height:1.1;letter-spacing:-0.25px}
  .payday{font-size:8px;margin-top:1px}
  .today .daynum{width:20px;height:20px}
  .controls{padding:9px;margin-top:7px}
  #selected{font-size:13px;margin-bottom:7px}
  .slot-grid{grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:7px}
  .slot{font-size:14px;padding:7px 2px;border-radius:8px}
  .preview{padding:6px 8px;margin:5px 0 7px}
  .preview .p1{font-size:11px}
  .preview .p2{font-size:19px}
  .actions button{padding:9px;font-size:14px}
  .note{font-size:10px;margin-top:7px}
}

.settings-panel{background:#fff;border-radius:16px;padding:11px 12px;margin-top:9px}
body.dark .settings-panel{background:#1f2937}
.settings-panel summary{cursor:pointer;font-weight:800;list-style:none}
.settings-panel summary::-webkit-details-marker{display:none}
.rate-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:6px;align-items:end;margin-top:10px}
.rate-row label{font-size:10px;color:#666}
body.dark .rate-row label{color:#d1d5db}
.rate-row input{width:100%;padding:8px 7px;border:1px solid #d7dbe0;border-radius:9px;font-size:13px;background:#fff;color:#111}
body.dark .rate-row input{background:#111827;color:#f9fafb;border-color:#4b5563}
.rate-add{margin-top:10px;border:0;border-radius:10px;padding:9px 12px;background:#111;color:#fff;font-weight:700}
body.dark .rate-add{background:#f9fafb;color:#111827}
.rate-delete{border:0;border-radius:9px;padding:8px 9px;background:#eee;color:#111}
body.dark .rate-delete{background:#374151;color:#fff}
.rate-note{font-size:10px;color:#666;margin-top:8px;line-height:1.4}
body.dark .rate-note{color:#d1d5db}
@media (max-width:480px){
  .rate-row{grid-template-columns:1fr 1fr;gap:6px}
  .rate-row .delete-wrap{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="wrap">
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
<h1>塾バイト給料カレンダー</h1>
<button class="theme-btn" id="themeToggle" onclick="toggleTheme()" aria-label="ダークモード切替">◐</button>
</div>

<div class="summary">
<div class="sub" id="summaryLabel">今月の給料見込み</div>
<div class="big" id="total">0円</div>
<div class="sub"><span id="daysCount">0</span>日勤務・<span id="lessonCount">0</span>コマ</div>
</div>

<div class="calendar">
<div class="head">
<button onclick="moveMonth(-1)">‹</button>
<div class="month" id="monthTitle"></div>
<button onclick="moveMonth(1)">›</button>
</div>
<div class="week">
<div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
</div>
<div class="grid" id="grid"></div>
</div>

<div class="controls">
<div id="selected">日付をタップ</div>

<div class="slot-grid" id="slotGrid">
<button class="slot" data-slot="X" onclick="toggleSlot('X')">X</button>
<button class="slot" data-slot="Y" onclick="toggleSlot('Y')">Y</button>
<button class="slot" data-slot="Z" onclick="toggleSlot('Z')">Z</button>
<button class="slot" data-slot="A" onclick="toggleSlot('A')">A</button>
<button class="slot" data-slot="B" onclick="toggleSlot('B')">B</button>
<button class="slot" data-slot="C" onclick="toggleSlot('C')">C</button>
<button class="slot" data-slot="D" onclick="toggleSlot('D')">D</button>
</div>

<div class="preview">
<div class="p1" id="selectedSlots">0コマ選択</div>
<div class="p2" id="dayPay">0円</div>
</div>

<div class="actions">
<button class="save" onclick="save()">保存</button>
<button class="clear" onclick="clearDay()">勤務なし</button>
</div>

<div class="note" id="rateSummary"></div>
</div>

<details class="settings-panel">
<summary>給与単価の設定</summary>
<div id="rateList"></div>
<button class="rate-add" onclick="addRate()">＋ 単価を追加</button>
<div class="rate-note">
適用開始日以降の勤務にその単価を使います。過去の勤務は、それ以前の単価のまま計算されます。
</div>
</details>
</div>

<script>
const KEY = "juku_salary_slots_v1";
const RATE_KEY = "juku_salary_rates_v1";
const DEFAULT_RATES = [
  { start:"2000-01-01", lesson:2026, daily:513, transport:420 }
];
const SLOTS = ["X","Y","Z","A","B","C","D"];

let data = JSON.parse(localStorage.getItem(KEY) || "{}");
let rates = JSON.parse(localStorage.getItem(RATE_KEY) || "null") || DEFAULT_RATES;
let view = new Date();
view = new Date(view.getFullYear(), view.getMonth(), 1);

let selected = null;
let tempSlots = [];

function money(n){ return n.toLocaleString("ja-JP") + "円"; }
function pad(n){ return String(n).padStart(2,"0"); }
function keyOf(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function getRate(date){
  const sorted = [...rates].sort((a,b)=>a.start.localeCompare(b.start));
  let current = sorted[0] || DEFAULT_RATES[0];
  for(const r of sorted){
    if(r.start <= date) current = r;
  }
  return current;
}
function dayPay(c, date){
  if(c <= 0) return 0;
  const r = getRate(date);
  return r.lesson * c + r.daily + r.transport;
}

function getSlots(date){
  const v = data[date];
  return Array.isArray(v) ? v : [];
}

function renderCalendar(){
  const y = view.getFullYear();
  const m = view.getMonth();

  document.getElementById("monthTitle").textContent = `${y}年${m+1}月`;
  document.getElementById("summaryLabel").textContent = `${y}年${m+1}月の給料見込み`;

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const firstDay = new Date(y,m,1).getDay();
  const lastDate = new Date(y,m+1,0).getDate();

  for(let i=0;i<firstDay;i++){
    const b = document.createElement("div");
    b.className = "blank";
    grid.appendChild(b);
  }

  const today = new Date();

  for(let d=1; d<=lastDate; d++){
    const key = keyOf(y,m,d);
    const slots = getSlots(key);
    const c = slots.length;

    const btn = document.createElement("button");
    btn.className = "day";

    if(today.getFullYear()===y && today.getMonth()===m && today.getDate()===d){
      btn.classList.add("today");
    }

    const payday = d === 15 ? `<span class="payday">給料日</span>` : "";
    const shift = c > 0
      ? `<span class="entry">${slots.join("・")}<br>${money(dayPay(c,key))}</span>`
      : "";

    btn.innerHTML = `<span class="daynum">${d}</span>${payday}${shift}`;
    if(selected === key) btn.classList.add("selected-day");
    btn.onclick = () => selectDay(key);
    grid.appendChild(btn);
  }

  const used = firstDay + lastDate;
  const trailing = (7 - (used % 7)) % 7;

  for(let i=0;i<trailing;i++){
    const b = document.createElement("div");
    b.className = "blank";
    grid.appendChild(b);
  }

  renderSummary();
}

function renderSummary(){
  const y = view.getFullYear();
  const m = view.getMonth();
  const prefix = `${y}-${pad(m+1)}-`;

  let total=0, days=0, lessons=0;

  for(const [date,slots] of Object.entries(data)){
    if(!date.startsWith(prefix) || !Array.isArray(slots) || slots.length===0) continue;
    days++;
    lessons += slots.length;
    total += dayPay(slots.length,date);
  }

  document.getElementById("total").textContent = money(total);
  document.getElementById("daysCount").textContent = days;
  document.getElementById("lessonCount").textContent = lessons;
}

function selectDay(key){
  selected = key;
  tempSlots = [...getSlots(key)];

  document.getElementById("selected").textContent =
    selected.replaceAll("-","/") + " のコマを選択";

  renderSlotButtons();
  renderDayPreview();
  renderCalendar();
}

function toggleSlot(slot){
  if(!selected) return;

  if(tempSlots.includes(slot)){
    tempSlots = tempSlots.filter(s => s !== slot);
  }else{
    tempSlots.push(slot);
    tempSlots.sort((a,b)=>SLOTS.indexOf(a)-SLOTS.indexOf(b));
  }

  renderSlotButtons();
  renderDayPreview();
}

function renderSlotButtons(){
  document.querySelectorAll(".slot").forEach(btn => {
    btn.classList.toggle("active", tempSlots.includes(btn.dataset.slot));
  });
}

function renderDayPreview(){
  const c = tempSlots.length;
  document.getElementById("selectedSlots").textContent =
    c === 0 ? "0コマ選択" : `${tempSlots.join("・")}　${c}コマ`;
  document.getElementById("dayPay").textContent = money(dayPay(c,key));
}

function save(){
  if(!selected) return;

  if(tempSlots.length > 0){
    data[selected] = [...tempSlots];
  }else{
    delete data[selected];
  }

  localStorage.setItem(KEY, JSON.stringify(data));
  renderCalendar();
}

function clearDay(){
  if(!selected) return;

  delete data[selected];
  tempSlots = [];
  localStorage.setItem(KEY, JSON.stringify(data));

  renderSlotButtons();
  renderDayPreview();
  renderCalendar();
}

function moveMonth(diff){
  view = new Date(view.getFullYear(), view.getMonth()+diff, 1);
  selected = null;
  tempSlots = [];

  document.getElementById("selected").textContent = "日付をタップ";
  renderSlotButtons();
  renderDayPreview();
  renderCalendar();
}



function saveRates(){
  rates = rates
    .map(r=>({
      start:r.start,
      lesson:Number(r.lesson)||0,
      daily:Number(r.daily)||0,
      transport:Number(r.transport)||0
    }))
    .sort((a,b)=>a.start.localeCompare(b.start));
  localStorage.setItem(RATE_KEY, JSON.stringify(rates));
  renderRates();
  renderCalendar();
  renderDayPreview();
}

function renderRates(){
  const list = document.getElementById("rateList");
  if(!list) return;

  const sorted = [...rates].sort((a,b)=>a.start.localeCompare(b.start));
  list.innerHTML = sorted.map((r,i)=>`
    <div class="rate-row">
      <label>適用開始日
        <input type="date" value="${r.start}" onchange="updateRate(${i},'start',this.value)">
      </label>
      <label>コマ給
        <input type="number" inputmode="numeric" value="${r.lesson}" onchange="updateRate(${i},'lesson',this.value)">
      </label>
      <label>日次手当
        <input type="number" inputmode="numeric" value="${r.daily}" onchange="updateRate(${i},'daily',this.value)">
      </label>
      <label>交通費
        <input type="number" inputmode="numeric" value="${r.transport}" onchange="updateRate(${i},'transport',this.value)">
      </label>
      <div class="delete-wrap">
        <button class="rate-delete" onclick="deleteRate(${i})">削除</button>
      </div>
    </div>
  `).join("");

  const today = new Date();
  const k = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const r = getRate(k);
  const summary = document.getElementById("rateSummary");
  if(summary){
    summary.textContent = `現在の単価：1コマ ${money(r.lesson)} ＋ 日次手当 ${money(r.daily)} ＋ 交通費 ${money(r.transport)}`;
  }
}

function updateRate(index, field, value){
  const sorted = [...rates].sort((a,b)=>a.start.localeCompare(b.start));
  if(!sorted[index]) return;
  sorted[index][field] = field === "start" ? value : Number(value);
  rates = sorted;
  saveRates();
}

function addRate(){
  const today = new Date();
  const start = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const current = getRate(start);
  rates.push({
    start,
    lesson:current.lesson,
    daily:current.daily,
    transport:current.transport
  });
  saveRates();
}

function deleteRate(index){
  const sorted = [...rates].sort((a,b)=>a.start.localeCompare(b.start));
  if(sorted.length <= 1) return;
  sorted.splice(index,1);
  rates = sorted;
  saveRates();
}

function applyTheme(){
  const saved = localStorage.getItem("juku_theme");
  if(saved === "dark"){
    document.body.classList.add("dark");
  }else if(saved === "light"){
    document.body.classList.remove("dark");
  }else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
    document.body.classList.add("dark");
  }
}

function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem("juku_theme", document.body.classList.contains("dark") ? "dark" : "light");
}

applyTheme();
renderRates();
renderCalendar();
renderSlotButtons();
renderDayPreview();
</script>
</body>
</html>
