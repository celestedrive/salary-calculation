<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>給与カレンダー</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
*{box-sizing:border-box}
button,.day,.slot{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#111827;color:#f9fafb}
.wrap{max-width:760px;margin:auto;padding:10px 10px 24px}
h1{font-size:22px;margin:2px 0 8px;text-align:center}
.summary{background:#1f2937;border-radius:16px;padding:11px 14px;margin-bottom:9px;text-align:center}
.big{font-size:27px;font-weight:800;white-space:nowrap}
.sub{font-size:13px;color:#666}
.calendar{background:#1f2937;border-radius:16px;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;padding:7px 10px}
.head button{border:0;background:#374151;color:#f9fafb;width:36px;height:32px;border-radius:10px;font-size:20px;font-weight:700}
.month{font-size:18px;font-weight:800}
.month-picker-btn{
  border:0;
  background:transparent;
  color:#f9fafb;
  padding:4px 12px;
  border-radius:9px;
  width:auto !important;
  min-width:112px;
  height:auto !important;
  cursor:pointer;
  white-space:nowrap;
  word-break:keep-all;
  overflow:visible;
  line-height:1.2;
}
.month-picker-btn:active{background:#374151}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.week div{text-align:center;padding:4px 0;font-size:11px;color:#d1d5db;border-top:1px solid #374151}
.day,.blank{min-height:58px;border:0;border-top:1px solid #374151;border-right:1px solid #374151;background:#1f2937;color:#f9fafb;text-align:left;padding:4px}
.day:nth-child(7n),.blank:nth-child(7n){border-right:0}
.blank{background:#111827}
.daynum{font-weight:700}
.entry{display:block;font-size:10px;margin-top:3px;font-weight:700;line-height:1.15;white-space:nowrap;color:#d1d5db}
.payday{display:block;font-size:9px;margin-top:2px;font-weight:800;color:#b45309}
.controls{background:#1f2937;border-radius:16px;padding:11px 12px;margin-top:9px}
#selected{font-weight:700;margin-bottom:12px}
.slot-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px}
.slot{
  border:1px solid #4b5563;background:#111827;color:#f9fafb;border-radius:10px;padding:9px 3px;
  font-size:17px;font-weight:800;cursor:pointer
}
.slot.active{background:#f9fafb;color:#111827;border-color:#f9fafb}
.study-row{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0}
.study-settings{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.study-settings.active{display:grid}
.study-time{display:flex;flex-direction:column;gap:4px;border:1px solid #4b5563;background:#111827;border-radius:10px;padding:6px 8px;font-size:11px;color:#d1d5db}
.study-time input{width:100%;min-width:0;padding:6px 7px;border:0;border-radius:7px;background:#1f2937;color:#f9fafb;font-size:15px;font-weight:700;color-scheme:dark}
@media(max-width:520px){.study-settings{grid-template-columns:1fr 1fr}.study-hours{grid-column:1/-1}}
.study-toggle{border:1px solid #4b5563;background:#111827;color:#f9fafb;border-radius:10px;padding:10px 8px;font-size:15px;font-weight:800}
.study-toggle.active{background:#f9fafb;color:#111827;border-color:#f9fafb}
.study-hours{display:none;align-items:center;gap:7px;border:1px solid #4b5563;background:#111827;border-radius:10px;padding:5px 8px;font-size:12px;color:#d1d5db}
.study-hours.active{display:flex}
.study-hours input{width:100%;min-width:0;padding:5px 7px;border:0;border-radius:7px;background:#1f2937;color:#f9fafb;font-size:15px;font-weight:700}
.preview{background:#111827;border-radius:12px;padding:8px 10px;margin:7px 0 8px}
.preview .p1{font-size:13px;color:#666}
.preview .p2{font-size:22px;font-weight:800;margin-top:3px;white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{font-size:16px;padding:12px;border:0;border-radius:12px}
.save{background:#111;color:#fff}
.clear{background:#374151;color:#f9fafb}
.note{font-size:12px;color:#666;margin-top:10px;line-height:1.5}
.today .daynum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#111;color:#fff}
.day.selected-day{
  background:#dbeafe !important;
  box-shadow:inset 0 0 0 3px #2563eb !important;
}
.day.selected-day .daynum{
  color:#1d4ed8 !important;
  font-weight:900;
}
.day.today.selected-day .daynum{
  background:#111 !important;
  color:#fff !important;
  box-shadow:0 0 0 2px #fff,0 0 0 4px #2563eb !important;
}
@media (max-width:480px){
  .month-picker-btn{
    min-width:104px;
    font-size:15px;
    padding:3px 8px;
    white-space:nowrap;
  }
  .wrap{padding:7px 7px 18px}
  h1{font-size:19px;margin:0 0 6px}
  .summary{padding:8px 11px;margin-bottom:7px}
  .summary .big{font-size:24px}
  .summary .sub{font-size:11px}
  .head{padding:5px 7px}
  .month{font-size:16px}
  .head button{width:34px;height:28px}
  .week div{padding:3px 0;font-size:10px}
  .day,.blank{min-height:51px;padding:3px}
  .daynum{font-size:11px}
  .entry{font-size:8.5px;margin-top:2px;line-height:1.1;letter-spacing:-0.25px}
  .payday{font-size:8px;margin-top:1px}
  .today .daynum{width:20px;height:20px}
  .controls{padding:9px;margin-top:7px}
  #selected{font-size:13px;margin-bottom:7px}
  .slot-grid{grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:7px}
  .slot{font-size:14px;padding:7px 2px;border-radius:8px}
  .preview{padding:6px 8px;margin:5px 0 7px}
  .preview .p1{font-size:11px}
  .preview .p2{font-size:19px}
  .actions button{padding:9px;font-size:14px}
  .note{font-size:10px;margin-top:7px}
}

.settings-panel{background:#1f2937;border-radius:16px;padding:11px 12px;margin-top:9px}
.settings-panel summary{cursor:pointer;font-weight:800;list-style:none}
.settings-panel summary::-webkit-details-marker{display:none}
.rate-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:6px;align-items:end;margin-top:10px}
.rate-row label{font-size:10px;color:#d1d5db}
.rate-row input{width:100%;padding:8px 7px;border:1px solid #4b5563;border-radius:9px;font-size:13px;background:#111827;color:#f9fafb}
.rate-add{margin-top:10px;border:0;border-radius:10px;padding:9px 12px;background:#f9fafb;color:#111827;font-weight:700}
.rate-delete{border:0;border-radius:9px;padding:8px 9px;background:#374151;color:#fff}
.rate-note{font-size:10px;color:#d1d5db;margin-top:8px;line-height:1.4}
@media (max-width:480px){
  .rate-row{grid-template-columns:1fr 1fr;gap:6px}
  .rate-row .delete-wrap{grid-column:1/-1}
}
.day.selected-day{
  background:#1d4ed8 !important;
  box-shadow:inset 0 0 0 3px #7dd3fc !important;
}
.day.selected-day .daynum{color:#fff !important;font-weight:900 !important}
.day.selected-day .entry{color:#fff !important}
.day.today.selected-day .daynum{
  background:#111827 !important;color:#fff !important;
  box-shadow:0 0 0 2px #1d4ed8,0 0 0 4px #7dd3fc !important;
}

.month-picker-backdrop{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.58);
}
.month-picker-backdrop.open{display:flex}
.month-picker{
  width:min(360px,100%);
  background:#1f2937;
  border:1px solid #374151;
  border-radius:18px;
  padding:14px;
}
.month-picker-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.month-picker-year{
  font-size:18px;
  font-weight:800;
  text-align:center;
  flex:1;
}
.month-picker-head button{
  border:0;
  background:#374151;
  color:#f9fafb;
  width:36px;
  height:34px;
  border-radius:10px;
  font-size:18px;
}
.month-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}
.month-choice{
  border:1px solid #4b5563;
  background:#111827;
  color:#f9fafb;
  min-height:45px;
  border-radius:11px;
  font-size:15px;
  font-weight:700;
}
.month-choice.current{
  background:#1d4ed8;
  border-color:#7dd3fc;
  box-shadow:inset 0 0 0 1px #7dd3fc;
}

.backup-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.backup-btn{display:flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:10px 12px;background:#374151;color:#f9fafb;font-size:13px;font-weight:800;cursor:pointer}
.backup-label input{display:none}


.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px;background:#1f2937;padding:5px;border-radius:14px}
.tab-btn{border:0;border-radius:10px;padding:10px 8px;background:transparent;color:#d1d5db;font-size:14px;font-weight:800}
.tab-btn.active{background:#f9fafb;color:#111827}
.app-panel[hidden]{display:none}
.plan-info{background:#111827;border-radius:12px;padding:10px;margin:8px 0;display:grid;gap:6px}
.plan-info-row{font-size:13px;line-height:1.45}
.plan-info-label{color:#9ca3af;font-size:11px;margin-right:6px}
.plan-form{display:grid;gap:9px;margin-top:10px}
.plan-time-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan-event-list{display:grid;gap:7px;margin:8px 0 12px}
.plan-event-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;background:#111827;border:1px solid #374151;border-radius:10px;padding:9px 10px}
.plan-event-text{font-size:13px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-event-edit,.plan-event-delete{border:0;border-radius:8px;background:#374151;color:#f9fafb;padding:7px 9px;font-size:12px;font-weight:800}.plan-event-edit{background:#4b5563}
.plan-add{background:#f9fafb;color:#111827;border:0;border-radius:11px;padding:11px;font-size:14px;font-weight:800}
.plan-form label{display:grid;gap:5px;font-size:12px;color:#d1d5db}
.plan-form input,.plan-form textarea{width:100%;border:1px solid #4b5563;border-radius:10px;background:#111827;color:#f9fafb;padding:10px;font:inherit;font-size:16px}
.plan-form textarea{min-height:92px;resize:vertical}
.plan-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan-actions button{border:0;border-radius:11px;padding:11px;font-size:14px;font-weight:800}
.plan-save{background:#f9fafb;color:#111827}.plan-clear{background:#374151;color:#f9fafb}
.plan-entry{display:block;font-size:9px;margin-top:2px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d1d5db}
.memo-dot{display:inline-block;margin-left:3px;font-size:9px;color:#d1d5db}

/* 予定カレンダー：画面いっぱい表示 */
body.plan-mode .wrap{max-width:none;width:100%;padding:0 0 18px}
body.plan-mode .tabs{margin:6px 7px 8px}
body.plan-mode #planPanel>h1{margin:4px 0 8px}
body.plan-mode #planPanel .calendar{border-radius:0;width:100%}
body.plan-mode #planPanel .head{padding:9px 10px}
body.plan-mode #planPanel .week div{padding:6px 0;font-size:12px}
body.plan-mode #planPanel .day,
body.plan-mode #planPanel .blank{min-height:72px;padding:5px}
body.plan-mode #planPanel .daynum{font-size:13px}
body.plan-mode #planPanel .plan-entry{font-size:10px;margin-top:3px}
body.plan-mode #planPanel .controls{display:none}
.plan-modal-backdrop{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.64)}
.plan-modal-backdrop.open{display:flex}
.plan-modal{width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;background:#1f2937;border:1px solid #374151;border-radius:18px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.plan-modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.plan-modal-date{font-size:18px;font-weight:900}
.plan-modal-close{width:40px;height:40px;border:0;border-radius:10px;background:#374151;color:#f9fafb;font-size:24px;line-height:1}
.plan-modal .plan-info{margin:8px 0 10px}
.plan-modal .plan-form{margin-top:0}
.plan-modal .plan-form textarea{min-height:110px}
@media (max-width:480px){
  .plan-modal-backdrop{padding:10px}
  .plan-modal{padding:12px;border-radius:16px}

  body.plan-mode #planPanel .day,
  body.plan-mode #planPanel .blank{min-height:68px;padding:4px}
  body.plan-mode #planPanel .daynum{font-size:12px}
  body.plan-mode #planPanel .plan-entry{font-size:9px;letter-spacing:-.2px}
}


/* 予定カレンダー：長い予定文字列で7列幅が崩れないよう固定 */
body.plan-mode #planPanel .week,
body.plan-mode #planPanel .grid{
  grid-template-columns:repeat(7,minmax(0,1fr));
  width:100%;
  min-width:0;
}
body.plan-mode #planPanel .day,
body.plan-mode #planPanel .blank{
  min-width:0;
  width:auto;
  overflow:hidden;
  box-sizing:border-box;
}
body.plan-mode #planPanel .plan-entry{
  display:block;
  width:100%;
  min-width:0;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
body.plan-mode #planPanel .calendar,
body.plan-mode #planPanel{
  min-width:0;
  max-width:100%;
  overflow:hidden;
  box-sizing:border-box;
}


/* 両カレンダー共通：7列の幅を内容に左右されないよう固定 */
.calendar .week,
.calendar .grid{
  grid-template-columns:repeat(7,minmax(0,1fr)) !important;
  width:100%;
  min-width:0;
}
.calendar .day,
.calendar .blank{
  min-width:0 !important;
  width:auto !important;
  overflow:hidden;
  box-sizing:border-box;
}

/* 給与カレンダーも長い内容で横幅を押し広げない */
#salaryPanel,
#salaryPanel .calendar{
  width:100%;
  min-width:0;
  max-width:100%;
  box-sizing:border-box;
  overflow:hidden;
}
#salaryPanel .day{
  min-width:0;
  overflow:hidden;
}

/* 日付マス内の情報量を増やすため文字を小さくする */
#salaryPanel .day,
#planPanel .day{
  font-size:10px;
}
#salaryPanel .daynum,
#planPanel .daynum{
  font-size:12px;
  line-height:1.05;
}
#salaryPanel .day .sub,
#salaryPanel .day .slots,
#salaryPanel .day .study,
#salaryPanel .day .amount,
#planPanel .plan-entry{
  font-size:8.5px !important;
  line-height:1.15 !important;
  letter-spacing:-.25px;
  max-width:100%;
}

/* 予定は省略記号で1行だけにせず、マス内で最大3行まで見せる */
body.plan-mode #planPanel .plan-entry{
  white-space:normal !important;
  overflow:hidden;
  text-overflow:clip;
  overflow-wrap:anywhere;
  word-break:break-word;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
}

/* 給与側の文字もマス内で折り返して情報を残す */
#salaryPanel .day *{
  max-width:100%;
  overflow-wrap:anywhere;
}
@media (max-width:480px){
  #salaryPanel .day,
  #planPanel .day{font-size:9px}
  #salaryPanel .daynum,
  #planPanel .daynum{font-size:11px}
  #salaryPanel .day .sub,
  #salaryPanel .day .slots,
  #salaryPanel .day .study,
  #salaryPanel .day .amount,
  #planPanel .plan-entry{
    font-size:7.5px !important;
    line-height:1.12 !important;
  }
}


/* 予定編集ポップアップ：開始・終了時間入力が横にはみ出さない */
.plan-modal,.plan-modal *{box-sizing:border-box}
.plan-modal .plan-form,.plan-modal .plan-form label{min-width:0;max-width:100%}
.plan-modal input,.plan-modal textarea,.plan-modal select{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box}
.plan-modal input[type="time"]{min-width:0;max-width:100%}


/* iPhone: 時刻入力の横はみ出し対策 */
.plan-modal-backdrop{
  box-sizing:border-box !important;
  width:100vw !important;
  max-width:100vw !important;
}
.plan-modal{
  box-sizing:border-box !important;
  width:calc(100vw - 20px) !important;
  max-width:520px !important;
  min-width:0 !important;
  overflow-x:hidden !important;
}
.plan-modal .plan-form,
.plan-modal .plan-form label,
.plan-modal .plan-form > *{
  box-sizing:border-box !important;
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
}
.plan-modal input,
.plan-modal textarea,
.plan-modal select{
  box-sizing:border-box !important;
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
}
.plan-modal input[type="time"]{
  display:block !important;
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
  -webkit-appearance:none;
  appearance:none;
}
.plan-modal input[type="time"]::-webkit-date-and-time-value{
  text-align:left;
  min-width:0;
}
@media (max-width:480px){
  .plan-modal-backdrop{padding:8px !important}
  .plan-modal{
    width:calc(100vw - 16px) !important;
    max-width:calc(100vw - 16px) !important;
    padding:12px !important;
  }
}


/* 予定カレンダー：スマホで月表示を画面いっぱい使う */
body.plan-mode .wrap{
  width:100% !important;
  max-width:none !important;
  padding-left:4px !important;
  padding-right:4px !important;
}
body.plan-mode #planPanel{
  width:100% !important;
  max-width:none !important;
}
body.plan-mode #planPanel .calendar{
  width:100% !important;
  max-width:none !important;
  border-radius:0 !important;
}
body.plan-mode #planPanel .grid{
  grid-template-columns:repeat(7,minmax(0,1fr)) !important;
}
body.plan-mode #planPanel .day,
body.plan-mode #planPanel .blank{
  min-width:0 !important;
  height:clamp(92px,15.2vh,145px) !important;
  min-height:92px !important;
  padding:5px 4px !important;
  align-content:start !important;
}
body.plan-mode #planPanel .daynum{
  font-size:13px !important;
  line-height:1 !important;
  margin-bottom:4px !important;
}
body.plan-mode #planPanel .plan-entry{
  font-size:8px !important;
  line-height:1.18 !important;
  margin-top:2px !important;
  -webkit-line-clamp:4 !important;
}
body.plan-mode #planPanel .week div{
  font-size:11px !important;
  padding:7px 0 !important;
}
@media (max-width:480px){
  body.plan-mode #planPanel .day,
  body.plan-mode #planPanel .blank{
    height:clamp(90px,14.5vh,125px) !important;
    min-height:90px !important;
    padding:4px 3px !important;
  }
  body.plan-mode #planPanel .daynum{font-size:12px !important}
  body.plan-mode #planPanel .plan-entry{font-size:7.5px !important}
}


/* 予定名を先、時間を改行して1文字分下げる */
body.plan-mode #planPanel .plan-entry{
  display:block !important;
  white-space:normal !important;
  overflow:hidden !important;
  -webkit-line-clamp:unset !important;
  margin-top:4px !important;
}
body.plan-mode #planPanel .plan-name{
  display:block !important;
  font-weight:700;
  line-height:1.1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
body.plan-mode #planPanel .plan-time{
  display:block !important;
  padding-left:1em;
  line-height:1.1;
  white-space:nowrap;
  font-weight:500;
}


/* 予定カレンダー：日付をマス上端へ固定し、予定表示領域を最大化 */
body.plan-mode #planPanel .day{
  position:relative !important;
  display:block !important;
  text-align:left !important;
  align-content:unset !important;
  justify-content:unset !important;
  padding:5px 3px 4px !important;
  overflow:hidden !important;
}
body.plan-mode #planPanel .daynum{
  position:static !important;
  display:block !important;
  width:max-content;
  margin:0 0 5px 0 !important;
  padding:0 !important;
  line-height:1 !important;
  text-align:left !important;
}

/* 今日の日付の丸も上端のまま */
body.plan-mode #planPanel .day.today .daynum{
  margin-bottom:5px !important;
}

/* 1件ごとの予定をコンパクトにして、時間を見切れさせない */
body.plan-mode #planPanel .plan-entry{
  display:block !important;
  width:100% !important;
  max-width:100% !important;
  margin:0 0 5px 0 !important;
  padding:0 !important;
  overflow:visible !important;
  white-space:normal !important;
}
body.plan-mode #planPanel .plan-name{
  display:block !important;
  width:100% !important;
  font-size:8px !important;
  line-height:1.08 !important;
  font-weight:700;
  white-space:nowrap !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
}
body.plan-mode #planPanel .plan-time{
  display:block !important;
  width:100% !important;
  padding-left:.55em !important;
  padding-right:0 !important;
  font-size:7px !important;
  line-height:1.08 !important;
  font-weight:500;
  letter-spacing:-.45px !important;
  white-space:nowrap !important;
  overflow:visible !important;
  text-overflow:clip !important;
  box-sizing:border-box !important;
}

/* 大きくしたマスの高さを最初から最後まで予定表示に使う */
body.plan-mode #planPanel .day,
body.plan-mode #planPanel .blank{
  vertical-align:top !important;
}
@media (max-width:480px){
  body.plan-mode #planPanel .day{
    padding:4px 2px 3px !important;
  }
  body.plan-mode #planPanel .daynum{
    margin-bottom:4px !important;
    font-size:11px !important;
  }
  body.plan-mode #planPanel .plan-entry{
    margin-bottom:4px !important;
  }
  body.plan-mode #planPanel .plan-name{
    font-size:7.5px !important;
  }
  body.plan-mode #planPanel .plan-time{
    font-size:6.5px !important;
    padding-left:.45em !important;
    letter-spacing:-.55px !important;
  }
}


/* 日付を各マスの左上へ物理的に固定 */
body.plan-mode #planPanel .day{
  position:relative !important;
  display:block !important;
  padding:22px 3px 3px !important;
}
body.plan-mode #planPanel .daynum{
  position:absolute !important;
  top:5px !important;
  left:5px !important;
  right:auto !important;
  bottom:auto !important;
  transform:none !important;
  margin:0 !important;
  padding:0 !important;
  width:auto !important;
  height:auto !important;
  line-height:1 !important;
  z-index:2;
}
body.plan-mode #planPanel .day.today .daynum{
  top:3px !important;
  left:3px !important;
  margin:0 !important;
}
/* 予定は日付直下から開始 */
body.plan-mode #planPanel .plan-entry:first-of-type{
  margin-top:0 !important;
}
@media (max-width:480px){
  body.plan-mode #planPanel .day{
    padding:20px 2px 3px !important;
  }
  body.plan-mode #planPanel .daynum{
    top:4px !important;
    left:4px !important;
  }
}


/* 予定名だけ少し大きく */
body.plan-mode #planPanel .plan-name{
  font-size:9.5px !important;
  line-height:1.12 !important;
}
@media (max-width:480px){
  body.plan-mode #planPanel .plan-name{
    font-size:9px !important;
  }
}

</style>
</head>
<body>
<div class="wrap">
<div class="tabs" role="tablist" aria-label="カレンダー切替">
  <button type="button" class="tab-btn active" id="salaryTab" onclick="switchTab('salary')">給与カレンダー</button>
  <button type="button" class="tab-btn" id="planTab" onclick="switchTab('plan')">予定カレンダー</button>
</div>
<section class="app-panel" id="salaryPanel">
<h1>給与カレンダー</h1>

<div class="summary">
<div class="sub" id="summaryLabel">今月の給料見込み</div>
<div class="big" id="total">0円</div>
<div class="sub"><span id="daysCount">0</span>日勤務・<span id="lessonCount">0</span>コマ・勉強会<span id="studyHoursCount">0</span>時間</div>
</div>

<div class="calendar">
<div class="head">
<button onclick="moveMonth(-1)">‹</button>
<button class="month month-picker-btn" id="monthTitle" type="button" onclick="openMonthPicker()"></button>
<button onclick="moveMonth(1)">›</button>
</div>
<div class="week">
<div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
</div>
<div class="grid" id="grid"></div>
</div>

<div class="controls">
<div id="selected">日付をタップ</div>

<div class="slot-grid" id="slotGrid">
<button class="slot" data-slot="X" onclick="toggleSlot('X')">X</button>
<button class="slot" data-slot="Y" onclick="toggleSlot('Y')">Y</button>
<button class="slot" data-slot="Z" onclick="toggleSlot('Z')">Z</button>
<button class="slot" data-slot="A" onclick="toggleSlot('A')">A</button>
<button class="slot" data-slot="B" onclick="toggleSlot('B')">B</button>
<button class="slot" data-slot="C" onclick="toggleSlot('C')">C</button>
<button class="slot" data-slot="D" onclick="toggleSlot('D')">D</button>
</div>

<div class="study-row">
  <button type="button" class="study-toggle" id="studyToggle" onclick="toggleStudy()">勉強会</button>
  <div class="study-settings" id="studySettings">
    <label class="study-time"><span>開始</span><input id="studyStart" type="time" oninput="updateStudyTime()" step="300"></label>
    <label class="study-time"><span>終了</span><input id="studyEnd" type="time" oninput="updateStudyTime()" step="300" readonly></label>
    <label class="study-hours active" id="studyHoursWrap">
      <span>時間</span>
      <input id="studyHours" type="number" inputmode="decimal" min="0.5" step="0.5" value="2" oninput="updateStudyHours(this.value)">
    </label>
  </div>
</div>

<div class="preview">
<div class="p1" id="selectedSlots">0コマ選択</div>
<div class="p2" id="dayPay">0円</div>
</div>

<div class="actions">
<button class="save" onclick="save()">保存</button>
<button class="clear" onclick="clearDay()">勤務なし</button>
</div>

<div class="note" id="rateSummary"></div>
</div>

<details class="settings-panel">
<summary>給与単価の設定</summary>
<div id="rateList"></div>
<button class="rate-add" onclick="addRate()">＋ 単価を追加</button>
<div class="rate-note">
適用開始日以降の勤務にその単価を使います。過去の勤務は、それ以前の単価のまま計算されます。
</div>
<div class="backup-tools">
  <button type="button" class="backup-btn" onclick="exportBackup()">バックアップ</button>
  <label class="backup-btn backup-label">復元
    <input id="backupFile" type="file" accept="application/json,.json" onchange="importBackup(event)">
  </label>
</div>
<div class="rate-note">勤務データと給与単価設定をJSONファイルに保存・復元できます。</div>
</details>
</section>

<section class="app-panel" id="planPanel" hidden>
<h1>予定カレンダー</h1>
<div class="calendar">
  <div class="head">
    <button type="button" onclick="movePlanMonth(-1)">‹</button>
    <div class="month" id="planMonthTitle"></div>
    <button type="button" onclick="movePlanMonth(1)">›</button>
  </div>
  <div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
  <div class="grid" id="planGrid"></div>
</div>
</section>
</div>

<div class="plan-modal-backdrop" id="planModalBackdrop" onclick="closePlanModalFromBackdrop(event)">
  <div class="plan-modal" role="dialog" aria-modal="true" aria-labelledby="planSelected">
    <div class="plan-modal-head">
      <div class="plan-modal-date" id="planSelected">日付</div>
      <button type="button" class="plan-modal-close" onclick="closePlanModal()" aria-label="閉じる">×</button>
    </div>
    <div class="plan-info" id="planWorkInfo">
      <div class="plan-info-row"><span class="plan-info-label">塾</span><span id="planShiftInfo">なし</span></div>
      <div class="plan-info-row"><span class="plan-info-label">勉強会</span><span id="planStudyInfo">なし</span></div>
    </div>
    <div class="plan-event-list" id="planEventList"></div>
    <div class="plan-form">
      <label>予定名<input id="planTitle" type="text" maxlength="60" placeholder="例：ご飯"></label>
      <div class="plan-time-row">
        <label>開始時間<input id="planStart" type="time" step="300"></label>
        <label>終了時間（任意）<input id="planEnd" type="time" step="300"></label>
      </div>
      <button type="button" class="plan-add" id="planEventSaveButton" onclick="savePlanEvent()">＋ 予定を追加</button>
      <label>メモ<textarea id="planMemo" maxlength="1000" placeholder="その日のメモ"></textarea></label>
      <div class="plan-actions">
        <button type="button" class="plan-save" onclick="savePlanMemo()">メモを保存</button>
        <button type="button" class="plan-clear" onclick="clearPlanDay()">この日の予定・メモを削除</button>
      </div>
    </div>
  </div>
</div>


<div class="month-picker-backdrop" id="monthPickerBackdrop" onclick="closeMonthPickerFromBackdrop(event)">
  <div class="month-picker">
    <div class="month-picker-head">
      <button type="button" onclick="changePickerYear(-1)">‹</button>
      <div class="month-picker-year" id="pickerYear"></div>
      <button type="button" onclick="changePickerYear(1)">›</button>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </div>
</div>

<script>
const KEY = "juku_salary_slots_v1";
const RATE_KEY = "juku_salary_rates_v1";
const STUDY_KEY = "salary_calendar_study_v1";
const PLAN_KEY = "salary_calendar_plans_v1";
const STUDY_HOURLY = 1500;
const STUDY_TRANSPORT = 420;
const DEFAULT_RATES = [
  { start:"2000-01-01", lesson:2026, daily:513, transport:420 }
];
const SLOTS = ["X","Y","Z","A","B","C","D"];

let data = JSON.parse(localStorage.getItem(KEY) || "{}");
let rates = JSON.parse(localStorage.getItem(RATE_KEY) || "null") || DEFAULT_RATES;
let studyData = JSON.parse(localStorage.getItem(STUDY_KEY) || "{}");
let planData = JSON.parse(localStorage.getItem(PLAN_KEY) || "{}");
let view = new Date();
view = new Date(view.getFullYear(), view.getMonth(), 1);

let selected = null;
let tempSlots = [];
let tempStudy = false;
let tempStudyHours = 2;
let tempStudyStart = "";
let tempStudyEnd = "";
let pickerYear = view.getFullYear();
let planView = new Date(view.getFullYear(), view.getMonth(), 1);
let planSelected = null;
let editingPlanEventId = null;

function money(n){ return n.toLocaleString("ja-JP") + "円"; }
function pad(n){ return String(n).padStart(2,"0"); }
function keyOf(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function getRate(date){
  const sorted = [...rates].sort((a,b)=>a.start.localeCompare(b.start));
  let current = sorted[0] || DEFAULT_RATES[0];
  for(const r of sorted){
    if(r.start <= date) current = r;
  }
  return current;
}
function dayPay(c, date){
  if(c <= 0) return 0;
  const r = getRate(date);
  return r.lesson * c + r.daily + r.transport;
}
function getStudyEntry(date){
  const v = studyData[date];
  if(v && typeof v === "object") {
    const h = Number(v.hours);
    return {hours:Number.isFinite(h)&&h>0?h:0,start:typeof v.start==="string"?v.start:"",end:typeof v.end==="string"?v.end:""};
  }
  const h = Number(v);
  return {hours:Number.isFinite(h)&&h>0?h:0,start:"",end:""};
}
function getStudyHours(date){ return getStudyEntry(date).hours; }
function getStudyTimeRange(date){
  const e=getStudyEntry(date);
  return e.start && e.end ? `${e.start}-${e.end}` : "";
}
function minutesBetween(start,end){
  if(!start||!end) return 0;
  const [sh,sm]=start.split(":").map(Number), [eh,em]=end.split(":").map(Number);
  if(![sh,sm,eh,em].every(Number.isFinite)) return 0;
  let mins=(eh*60+em)-(sh*60+sm);
  if(mins<=0) return 0;
  return mins;
}
function studyPay(hours){
  return hours > 0 ? STUDY_HOURLY * hours + STUDY_TRANSPORT : 0;
}

function getSlots(date){
  const v = data[date];
  return Array.isArray(v) ? v : [];
}

function renderCalendar(){
  const y = view.getFullYear();
  const m = view.getMonth();

  document.getElementById("monthTitle").textContent = `${y}年${m+1}月`;
  document.getElementById("summaryLabel").textContent = `${y}年${m+1}月の給料見込み`;

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const firstDay = new Date(y,m,1).getDay();
  const lastDate = new Date(y,m+1,0).getDate();

  for(let i=0;i<firstDay;i++){
    const b = document.createElement("div");
    b.className = "blank";
    grid.appendChild(b);
  }

  const today = new Date();

  for(let d=1; d<=lastDate; d++){
    const key = keyOf(y,m,d);
    const slots = getSlots(key);
    const c = slots.length;
    const studyHours = getStudyHours(key);

    const btn = document.createElement("button");
    btn.className = "day";

    if(today.getFullYear()===y && today.getMonth()===m && today.getDate()===d){
      btn.classList.add("today");
    }

    const payday = d === 15 ? `<span class="payday">給料日</span>` : "";
    const shift = c > 0
      ? `<span class="entry">${slots.join("・")}<br>${money(dayPay(c,key))}</span>`
      : "";
    const studyRange = getStudyTimeRange(key);
    const study = studyHours > 0
      ? `<span class="entry">勉強会 ${studyRange ? studyRange+"<br>" : ""}${studyHours}h<br>${money(studyPay(studyHours))}</span>`
      : "";

    btn.innerHTML = `<span class="daynum">${d}</span>${payday}${shift}${study}`;
    if(selected === key){
      btn.classList.add("selected-day");
      btn.dataset.selected = "true";
      btn.setAttribute("aria-current","date");
    }
    btn.onclick = () => selectDay(key);
    grid.appendChild(btn);
  }

  const used = firstDay + lastDate;
  const trailing = (7 - (used % 7)) % 7;

  for(let i=0;i<trailing;i++){
    const b = document.createElement("div");
    b.className = "blank";
    grid.appendChild(b);
  }

  renderSummary();
}

function renderSummary(){
  const y = view.getFullYear();
  const m = view.getMonth();
  const prefix = `${y}-${pad(m+1)}-`;

  let total=0, days=0, lessons=0, studyHoursTotal=0;
  const workedDates = new Set();

  for(const [date,slots] of Object.entries(data)){
    if(!date.startsWith(prefix) || !Array.isArray(slots) || slots.length===0) continue;
    workedDates.add(date);
    lessons += slots.length;
    total += dayPay(slots.length,date);
  }

  for(const [date,value] of Object.entries(studyData)){
    if(!date.startsWith(prefix)) continue;
    const hours = Number(value);
    if(!Number.isFinite(hours) || hours <= 0) continue;
    workedDates.add(date);
    studyHoursTotal += hours;
    total += studyPay(hours);
  }

  days = workedDates.size;
  document.getElementById("total").textContent = money(total);
  document.getElementById("daysCount").textContent = days;
  document.getElementById("lessonCount").textContent = lessons;
  document.getElementById("studyHoursCount").textContent = studyHoursTotal.toLocaleString("ja-JP");
}

function selectDay(key){
  selected = key;
  tempSlots = [...getSlots(key)];
  const studyEntry = getStudyEntry(key);
  tempStudyHours = studyEntry.hours || 2;
  tempStudyStart = studyEntry.start || "";
  tempStudyEnd = studyEntry.end || "";
  tempStudy = studyEntry.hours > 0;

  document.getElementById("selected").textContent =
    selected.replaceAll("-","/") + " のコマを選択";

  renderCalendar();
  renderSlotButtons();
  renderStudyControls();
  renderDayPreview();
}

function toggleSlot(slot){
  if(!selected) return;

  if(tempSlots.includes(slot)){
    tempSlots = tempSlots.filter(s => s !== slot);
  }else{
    tempSlots.push(slot);
    tempSlots.sort((a,b)=>SLOTS.indexOf(a)-SLOTS.indexOf(b));
  }

  renderSlotButtons();
  renderDayPreview();
}

function renderSlotButtons(){
  document.querySelectorAll(".slot").forEach(btn => {
    btn.classList.toggle("active", tempSlots.includes(btn.dataset.slot));
  });
}

function toggleStudy(){
  if(!selected) return;
  tempStudy = !tempStudy;
  if(tempStudy && (!Number.isFinite(tempStudyHours) || tempStudyHours <= 0)) tempStudyHours = 2;
  renderStudyControls();
  renderDayPreview();
}

function updateStudyHours(value){
  const h = Number(value);
  tempStudyHours = Number.isFinite(h) && h > 0 ? h : 0;
  if(tempStudyHours > 0) tempStudy = true;
  renderStudyControls();
  renderDayPreview();
}

function updateStudyTime(){
  const start=document.getElementById("studyStart")?.value || "";
  const end=document.getElementById("studyEnd")?.value || "";
  tempStudyStart=start; tempStudyEnd=end;
  const mins=minutesBetween(start,end);
  if(mins>0){
    tempStudyHours=Math.round((mins/60)*100)/100;
    tempStudy=true;
  }
  renderStudyControls();
  renderDayPreview();
}

function renderStudyControls(){
  const btn = document.getElementById("studyToggle");
  const settings = document.getElementById("studySettings");
  const input = document.getElementById("studyHours");
  const startInput = document.getElementById("studyStart");
  const endInput = document.getElementById("studyEnd");
  if(btn) btn.classList.toggle("active", tempStudy);
  if(settings) settings.classList.toggle("active", tempStudy);
  if(input && document.activeElement !== input) input.value = tempStudyHours || 2;
  if(startInput && document.activeElement !== startInput) startInput.value=tempStudyStart;
  if(endInput && document.activeElement !== endInput) endInput.value=tempStudyEnd;
}

function renderDayPreview(){
  const c = tempSlots.length;
  const hours = tempStudy ? tempStudyHours : 0;
  const parts = [];
  if(c > 0) parts.push(`${tempSlots.join("・")}　${c}コマ`);
  if(hours > 0) parts.push(`勉強会 ${tempStudyStart&&tempStudyEnd?tempStudyStart+"-"+tempStudyEnd+"・":""}${hours}時間`);
  document.getElementById("selectedSlots").textContent = parts.length ? parts.join(" ＋ ") : "勤務なし";
  document.getElementById("dayPay").textContent = money(dayPay(c, selected || "9999-12-31") + studyPay(hours));
}

function save(){
  if(!selected) return;

  if(tempSlots.length > 0){
    data[selected] = [...tempSlots];
  }else{
    delete data[selected];
  }

  if(tempStudy && tempStudyHours > 0){
    studyData[selected] = {hours:tempStudyHours,start:tempStudyStart,end:tempStudyEnd};
  }else{
    delete studyData[selected];
  }

  localStorage.setItem(KEY, JSON.stringify(data));
  localStorage.setItem(STUDY_KEY, JSON.stringify(studyData));
  renderCalendar();
}

function clearDay(){
  if(!selected) return;

  delete data[selected];
  delete studyData[selected];
  tempSlots = [];
  tempStudy = false;
  tempStudyHours = 2;
  tempStudyStart = "";
  tempStudyEnd = "";
  localStorage.setItem(KEY, JSON.stringify(data));
  localStorage.setItem(STUDY_KEY, JSON.stringify(studyData));

  renderSlotButtons();
  renderStudyControls();
  renderDayPreview();
  renderCalendar();
}


function openMonthPicker(){
  pickerYear = view.getFullYear();
  renderMonthPicker();
  document.getElementById("monthPickerBackdrop").classList.add("open");
}

function closeMonthPicker(){
  document.getElementById("monthPickerBackdrop").classList.remove("open");
}

function closeMonthPickerFromBackdrop(e){
  if(e.target && e.target.id === "monthPickerBackdrop"){
    closeMonthPicker();
  }
}

function changePickerYear(diff){
  pickerYear += diff;
  renderMonthPicker();
}

function renderMonthPicker(){
  document.getElementById("pickerYear").textContent = pickerYear + "年";
  const grid = document.getElementById("monthGrid");
  grid.innerHTML = "";

  for(let m=0; m<12; m++){
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "month-choice";
    btn.textContent = (m+1) + "月";

    if(pickerYear === view.getFullYear() && m === view.getMonth()){
      btn.classList.add("current");
    }

    btn.addEventListener("click", () => {
      view = new Date(pickerYear, m, 1);
      selected = null;
      tempSlots = [];
      tempStudy = false; tempStudyHours = 2; tempStudyStart=""; tempStudyEnd="";
      document.getElementById("selected").textContent = "日付をタップ";
      renderCalendar();
      renderSlotButtons();
      renderStudyControls();
      renderDayPreview();
      closeMonthPicker();
    });

    grid.appendChild(btn);
  }
}


function moveMonth(diff){
  view = new Date(view.getFullYear(), view.getMonth()+diff, 1);
  selected = null;
  tempSlots = [];
  tempStudy = false; tempStudyHours = 2; tempStudyStart=""; tempStudyEnd="";

  document.getElementById("selected").textContent = "日付をタップ";
  renderCalendar();
  renderSlotButtons();
  renderStudyControls();
  renderDayPreview();
}




function exportBackup(){
  const backup={app:"salary-calendar",version:4,exportedAt:new Date().toISOString(),shifts:data,rates:rates,study:studyData,plans:planData};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const now=new Date();
  const stamp=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  a.href=url;
  a.download=`給与カレンダー_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importBackup(event){
  const file=event.target.files&&event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const backup=JSON.parse(reader.result);
      if(!backup||backup.app!=="salary-calendar"||typeof backup.shifts!=="object"||!Array.isArray(backup.rates)) throw new Error();
      data=backup.shifts||{};
      rates=backup.rates.length?backup.rates:DEFAULT_RATES;
      studyData=(backup.study && typeof backup.study==="object") ? backup.study : {};
      planData=(backup.plans && typeof backup.plans==="object") ? backup.plans : {};
      localStorage.setItem(KEY,JSON.stringify(data));
      localStorage.setItem(RATE_KEY,JSON.stringify(rates));
      localStorage.setItem(STUDY_KEY,JSON.stringify(studyData));
      localStorage.setItem(PLAN_KEY,JSON.stringify(planData));
      selected=null; tempSlots=[]; tempStudy=false; tempStudyHours=2; tempStudyStart=""; tempStudyEnd="";
      document.getElementById("selected").textContent="日付をタップ";
      renderRates(); renderCalendar(); renderSlotButtons(); renderStudyControls(); renderDayPreview();
      alert("バックアップを復元しました");
    }catch(e){
      alert("このバックアップファイルは読み込めません");
    }finally{
      event.target.value="";
    }
  };
  reader.readAsText(file);
}

function saveRates(){
  rates = rates
    .map(r=>({
      start:r.start,
      lesson:Number(r.lesson)||0,
      daily:Number(r.daily)||0,
      transport:Number(r.transport)||0
    }))
    .sort((a,b)=>a.start.localeCompare(b.start));
  localStorage.setItem(RATE_KEY, JSON.stringify(rates));
  renderRates();
  renderCalendar();
  renderDayPreview();
}

function renderRates(){
  const list = document.getElementById("rateList");
  if(!list) return;

  const sorted = [...rates].sort((a,b)=>a.start.localeCompare(b.start));
  list.innerHTML = sorted.map((r,i)=>`
    <div class="rate-row">
      <label>適用開始日
        <input type="date" value="${r.start}" onchange="updateRate(${i},'start',this.value)">
      </label>
      <label>コマ給
        <input type="number" inputmode="numeric" value="${r.lesson}" onchange="updateRate(${i},'lesson',this.value)">
      </label>
      <label>日次手当
        <input type="number" inputmode="numeric" value="${r.daily}" onchange="updateRate(${i},'daily',this.value)">
      </label>
      <label>交通費
        <input type="number" inputmode="numeric" value="${r.transport}" onchange="updateRate(${i},'transport',this.value)">
      </label>
      <div class="delete-wrap">
        <button class="rate-delete" onclick="deleteRate(${i})">削除</button>
      </div>
    </div>
  `).join("");

  const today = new Date();
  const k = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const r = getRate(k);
  const summary = document.getElementById("rateSummary");
  if(summary){
    summary.textContent = `塾：1コマ ${money(r.lesson)} ＋ 日次手当 ${money(r.daily)} ＋ 交通費 ${money(r.transport)} ／ 勉強会：時給 ${money(STUDY_HOURLY)} ＋ 交通費 ${money(STUDY_TRANSPORT)}`;
  }
}

function updateRate(index, field, value){
  const sorted = [...rates].sort((a,b)=>a.start.localeCompare(b.start));
  if(!sorted[index]) return;
  sorted[index][field] = field === "start" ? value : Number(value);
  rates = sorted;
  saveRates();
}

function addRate(){
  const today = new Date();
  const start = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const current = getRate(start);
  rates.push({
    start,
    lesson:current.lesson,
    daily:current.daily,
    transport:current.transport
  });
  saveRates();
}

function deleteRate(index){
  const sorted = [...rates].sort((a,b)=>a.start.localeCompare(b.start));
  if(sorted.length <= 1) return;
  sorted.splice(index,1);
  rates = sorted;
  saveRates();
}

function switchTab(tab){
  const salary = tab === "salary";
  if(salary) closePlanModal();
  document.getElementById("salaryPanel").hidden = !salary;
  document.getElementById("planPanel").hidden = salary;
  document.getElementById("salaryTab").classList.toggle("active", salary);
  document.getElementById("planTab").classList.toggle("active", !salary);
  document.body.classList.toggle("plan-mode", !salary);
  if(!salary){
    planView = new Date(view.getFullYear(), view.getMonth(), 1);
    renderPlanCalendar();
  }
}

const SLOT_TIMES = {
  X:["9:00","10:30"],
  Y:["10:35","12:05"],
  Z:["12:10","13:40"],
  A:["14:55","16:25"],
  B:["16:30","18:00"],
  C:["18:05","19:35"],
  D:["19:40","21:10"]
};

function getShiftTimeRange(slots){
  if(!slots || !slots.length) return "";
  const ordered=[...slots].sort((a,b)=>SLOTS.indexOf(a)-SLOTS.indexOf(b));
  const first=SLOT_TIMES[ordered[0]];
  const last=SLOT_TIMES[ordered[ordered.length-1]];
  return first && last ? `${first[0]}-${last[1]}` : "";
}

function getPlan(date){
  const v = planData[date];
  if(!v || typeof v !== "object") return {events:[],memo:""};
  if(Array.isArray(v.events)){
    return {
      events:v.events.filter(e=>e&&typeof e==="object").map((e,i)=>({
        id:String(e.id || `${date}-${i}`),
        title:String(e.title || ""),
        start:String(e.start || ""),
        end:String(e.end || "")
      })),
      memo:String(v.memo || "")
    };
  }
  // 旧データ（予定1件のみ）を自動変換
  const legacy=[];
  if(v.title || v.time) legacy.push({id:`${date}-legacy`,title:String(v.title||""),start:String(v.time||""),end:""});
  return {events:legacy,memo:String(v.memo||"")};
}

function planTimeText(start,end){
  if(start) return `${start}-${end || "未定"}`;
  return end ? `未定-${end}` : "時間未定";
}

function sortStart(value){
  return /^\d{2}:\d{2}$/.test(value||"") ? value : "99:99";
}

function getCalendarItems(key){
  const items=[];
  const slots=getSlots(key);
  if(slots.length){
    const range=getShiftTimeRange(slots);
    const start=range.split("-")[0]||"";
    items.push({start,name:"塾",time:range});
  }
  const hours=getStudyHours(key);
  if(hours>0){
    const range=getStudyTimeRange(key);
    const studyEntry=getStudyEntry(key);
    if(range) items.push({start:studyEntry.start||"",name:"勉強会",time:range});
    else items.push({start:"",name:"勉強会",time:`時間未定（${hours}h）`});
  }
  const plan=getPlan(key);
  for(const e of plan.events){
    const title=e.title || "予定";
    items.push({start:e.start||"",name:title,time:planTimeText(e.start,e.end)});
  }
  return items.sort((a,b)=>sortStart(a.start).localeCompare(sortStart(b.start)));
}

function renderPlanCalendar(){
  const y=planView.getFullYear(), m=planView.getMonth();
  document.getElementById("planMonthTitle").textContent=`${y}年${m+1}月`;
  const grid=document.getElementById("planGrid");
  grid.innerHTML="";
  const firstDay=new Date(y,m,1).getDay();
  const lastDate=new Date(y,m+1,0).getDate();
  for(let i=0;i<firstDay;i++){const b=document.createElement("div");b.className="blank";grid.appendChild(b);}
  const today=new Date();
  for(let d=1;d<=lastDate;d++){
    const key=keyOf(y,m,d), plan=getPlan(key);
    const btn=document.createElement("button"); btn.type="button"; btn.className="day";
    if(today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d)btn.classList.add("today");
    if(planSelected===key)btn.classList.add("selected-day");
    const entries=getCalendarItems(key).map(item=>`<span class="plan-entry"><span class="plan-name">${escapeHtml(item.name)}</span><span class="plan-time">${escapeHtml(item.time)}</span></span>`).join("");
    const memo=plan.memo?`<span class="memo-dot">●</span>`:"";
    btn.innerHTML=`<span class="daynum">${d}</span>${memo}${entries}`;
    btn.addEventListener("click",()=>selectPlanDay(key));
    grid.appendChild(btn);
  }
  const used=firstDay+lastDate, trailing=(7-(used%7))%7;
  for(let i=0;i<trailing;i++){const b=document.createElement("div");b.className="blank";grid.appendChild(b);}
}

function escapeHtml(value){
  return String(value||"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
}

function renderPlanEventList(){
  const list=document.getElementById("planEventList");
  if(!list || !planSelected) return;
  const plan=getPlan(planSelected);
  if(!plan.events.length){
    list.innerHTML='<div class="plan-info-row"><span class="plan-info-label">登録済み予定</span>なし</div>';
    return;
  }
  const sorted=[...plan.events].sort((a,b)=>sortStart(a.start).localeCompare(sortStart(b.start)));
  list.innerHTML=sorted.map(e=>`<div class="plan-event-item"><div class="plan-event-text">${escapeHtml(planTimeText(e.start,e.end))} ${escapeHtml(e.title||"予定")}</div><button type="button" class="plan-event-edit" data-id="${escapeHtml(e.id)}">編集</button><button type="button" class="plan-event-delete" data-id="${escapeHtml(e.id)}">削除</button></div>`).join("");
  list.querySelectorAll(".plan-event-edit").forEach(btn=>btn.addEventListener("click",()=>editPlanEvent(btn.dataset.id)));
  list.querySelectorAll(".plan-event-delete").forEach(btn=>btn.addEventListener("click",()=>deletePlanEvent(btn.dataset.id)));
}

function selectPlanDay(key){
  planSelected=key;
  const slots=getSlots(key), hours=getStudyHours(key), plan=getPlan(key);
  document.getElementById("planSelected").textContent=key.replaceAll("-","/");
  document.getElementById("planShiftInfo").textContent=slots.length?`${getShiftTimeRange(slots)}（${slots.join("・")}・${slots.length}コマ）`:"なし";
  const studyRange=getStudyTimeRange(key);
  document.getElementById("planStudyInfo").textContent=hours>0?(studyRange?`${studyRange}（${hours}時間）`:`${hours}時間`):"なし";
  resetPlanEventEditor();
  document.getElementById("planMemo").value=plan.memo||"";
  renderPlanEventList();
  renderPlanCalendar();
  document.getElementById("planModalBackdrop").classList.add("open");
  document.body.style.overflow="hidden";
}

function persistPlan(date, plan){
  if(plan.events.length || plan.memo) planData[date]=plan;
  else delete planData[date];
  localStorage.setItem(PLAN_KEY,JSON.stringify(planData));
}

function resetPlanEventEditor(){
  editingPlanEventId=null;
  document.getElementById("planTitle").value="";
  document.getElementById("planStart").value="";
  document.getElementById("planEnd").value="";
  const btn=document.getElementById("planEventSaveButton");
  if(btn) btn.textContent="＋ 予定を追加";
}

function editPlanEvent(id){
  if(!planSelected)return;
  const plan=getPlan(planSelected);
  const event=plan.events.find(e=>e.id===id);
  if(!event)return;
  editingPlanEventId=id;
  document.getElementById("planTitle").value=event.title||"";
  document.getElementById("planStart").value=event.start||"";
  document.getElementById("planEnd").value=event.end||"";
  const btn=document.getElementById("planEventSaveButton");
  if(btn) btn.textContent="変更を保存";
  document.getElementById("planTitle").focus();
}

function savePlanEvent(){
  if(!planSelected)return;
  const title=document.getElementById("planTitle").value.trim();
  const start=document.getElementById("planStart").value;
  const end=document.getElementById("planEnd").value;
  if(!title){ alert("予定名を入力してください"); return; }
  if(!start){ alert("開始時間を入力してください"); return; }
  if(end && end < start){ alert("終了時間は開始時間より後にしてください"); return; }
  const plan=getPlan(planSelected);
  if(editingPlanEventId){
    const target=plan.events.find(e=>e.id===editingPlanEventId);
    if(target){ target.title=title; target.start=start; target.end=end; }
    else plan.events.push({id:`${Date.now()}-${Math.random().toString(36).slice(2,7)}`,title,start,end});
  }else{
    plan.events.push({id:`${Date.now()}-${Math.random().toString(36).slice(2,7)}`,title,start,end});
  }
  persistPlan(planSelected,plan);
  resetPlanEventEditor();
  renderPlanEventList();
  renderPlanCalendar();
}

function deletePlanEvent(id){
  if(!planSelected)return;
  const plan=getPlan(planSelected);
  plan.events=plan.events.filter(e=>e.id!==id);
  persistPlan(planSelected,plan);
  if(editingPlanEventId===id) resetPlanEventEditor();
  renderPlanEventList();
  renderPlanCalendar();
}

function savePlanMemo(){
  if(!planSelected)return;
  const plan=getPlan(planSelected);
  plan.memo=document.getElementById("planMemo").value.trim();
  persistPlan(planSelected,plan);
  renderPlanCalendar();
  closePlanModal();
}

function clearPlanDay(){
  if(!planSelected)return;
  delete planData[planSelected];
  localStorage.setItem(PLAN_KEY,JSON.stringify(planData));
  resetPlanEventEditor();
  document.getElementById("planMemo").value="";
  renderPlanEventList();
  renderPlanCalendar();
  closePlanModal();
}

function closePlanModal(){
  const modal=document.getElementById("planModalBackdrop");
  if(modal)modal.classList.remove("open");
  document.body.style.overflow="";
}

function closePlanModalFromBackdrop(event){
  if(event.target===event.currentTarget)closePlanModal();
}

function movePlanMonth(diff){
  planView=new Date(planView.getFullYear(),planView.getMonth()+diff,1);
  planSelected=null;
  document.getElementById("planSelected").textContent="日付をタップ";
  document.getElementById("planShiftInfo").textContent="なし";
  document.getElementById("planStudyInfo").textContent="なし";
  resetPlanEventEditor();
  document.getElementById("planMemo").value="";
  renderPlanCalendar();
}

renderRates();
renderCalendar();
renderSlotButtons();
renderStudyControls();
renderDayPreview();

function updateStudyEndFromStart(){
  const startEl=document.getElementById("studyStart");
  const endEl=document.getElementById("studyEnd");
  const hoursEl=document.getElementById("studyHours");
  if(!startEl||!endEl||!hoursEl)return;
  const start=startEl.value;
  const hours=parseFloat(hoursEl.value||"0");
  if(!start||!(hours>0)){endEl.value="";return;}
  const parts=start.split(":").map(Number);
  if(parts.length!==2||parts.some(Number.isNaN)){endEl.value="";return;}
  let mins=parts[0]*60+parts[1]+Math.round(hours*60);
  mins=((mins%1440)+1440)%1440;
  endEl.value=String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
}
document.addEventListener("DOMContentLoaded",()=>{
  const startEl=document.getElementById("studyStart");
  const hoursEl=document.getElementById("studyHours");
  const endEl=document.getElementById("studyEnd");
  if(startEl){
    startEl.setAttribute("step","300");
    startEl.addEventListener("input",updateStudyEndFromStart);
    startEl.addEventListener("change",updateStudyEndFromStart);
  }
  if(hoursEl){
    hoursEl.addEventListener("input",updateStudyEndFromStart);
    hoursEl.addEventListener("change",updateStudyEndFromStart);
  }
  if(endEl){
    endEl.readOnly=true;
    endEl.tabIndex=-1;
  }
  updateStudyEndFromStart();
});
