<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="calendar-build" content="1789225339">
<title>カレンダー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:#f9fafb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{color:inherit}
.wrap{width:100%;height:100dvh;overflow:hidden}
.pager{display:flex;width:100%;height:100%;overflow:hidden;scroll-snap-type:none;scrollbar-width:none;touch-action:pan-y}
.pager::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;width:100%;min-width:100%;height:100%;padding:4px 8px 8px;overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column}
h1{font-size:17px;text-align:center;margin:2px 0 6px;flex:0 0 auto}
.card{background:#1f2937;border:1px solid #374151;border-radius:16px;overflow:hidden}
.calendar{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.cal-head{position:relative;display:flex;align-items:center;justify-content:center;padding:7px 9px;border-bottom:1px solid #374151;flex:0 0 auto}
.nav{width:34px;height:30px;border:0;border-radius:9px;background:#374151;font-size:20px;font-weight:800}
.month{width:auto;min-width:128px;border:0;background:transparent;text-align:center;font-size:16px;font-weight:900;padding:4px 0}
.today-jump{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:46px;height:28px;border:1px solid #4b5563;border-radius:8px;background:#111827;color:#d1d5db;padding:0 6px;font-size:11px;font-weight:800;z-index:2}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid #374151;flex:0 0 25px}
.week div{display:flex;align-items:center;justify-content:center;height:100%;align-self:stretch;font-size:11px;font-weight:800;border-right:1px solid #374151;padding:0;box-sizing:border-box}
.week div:last-child{border-right:0}
.week div:first-child{color:#ff5f67}.week div:last-child{color:#5aa7ff}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));flex:1 1 auto;min-height:0;background:#111827}
.day,.blank{position:relative;min-width:0;min-height:0;border:0;border-right:1px solid #374151;border-bottom:1px solid #374151;overflow:hidden}
.day{background:#111827}
.blank{background:#182231}
.grid>:nth-child(7n){border-right:0}
.grid>:nth-last-child(-n+7){border-bottom:0}
.day{padding:21px 3px 3px;text-align:left}
.daynum{position:absolute;left:5px;top:5px;font-size:12px;font-weight:700;line-height:1}
.holiday .daynum{color:#ff5f67}.saturday .daynum{color:#5aa7ff}
.today{background:#3b475a}
.selected{background:#1d4ed8;box-shadow:inset 0 0 0 2px #7dd3fc}
.memo-dot{position:absolute;top:4px;right:4px;font-size:8px}
.entry{display:block;overflow:hidden;margin-top:1px;white-space:nowrap;text-overflow:ellipsis;font-size:8px;font-weight:700;line-height:1.2;color:#d1d5db}
.entry strong{color:#fff}
.summary{flex:0 0 145px;margin-top:7px;padding:9px 10px;overflow:auto}
.summary-title{font-size:13px;font-weight:900;margin-bottom:6px}
.summary-row{display:flex;gap:9px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}
.summary-time{color:#cbd5e1;flex:0 0 auto;font-variant-numeric:tabular-nums}
.summary-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary-empty{font-size:12px;color:#9ca3af}
.summary-memo{font-size:11px;color:#cbd5e1;margin-top:7px}
.salary-calendar{flex:0 0 54%;min-height:0}
.controls{flex:1 1 auto;min-height:0;margin-top:7px;padding:9px 10px;overflow:auto}
.selected-date{font-size:13px;font-weight:800;margin-bottom:7px}
.slot-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.slot{border:1px solid #4b5563;background:#111827;border-radius:8px;padding:7px 1px;font-size:14px;font-weight:900}
.slot.active{background:#f9fafb;color:#111827}
.study-row{display:grid;grid-template-columns:auto 1fr;gap:7px;margin-top:8px;align-items:center}
.study-toggle{border:1px solid #4b5563;background:#111827;border-radius:9px;padding:8px;font-weight:800}
.study-toggle.active{background:#f9fafb;color:#111827}
.study-fields{display:none;grid-template-columns:72px 1fr;gap:6px;align-items:center}
.study-fields.active{display:grid}
input[type=time],input[type=number],input[type=text],textarea{width:100%;min-width:0;border:1px solid #4b5563;border-radius:8px;background:#111827;color:#fff;padding:7px;font-size:16px}
.preview{background:#111827;border-radius:10px;padding:7px 9px;margin-top:8px}
.preview small{color:#9ca3af}.preview strong{display:block;font-size:19px;margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.actions button,.primary,.secondary,.danger{border:0;border-radius:10px;padding:9px;font-weight:800}
.primary{background:#f9fafb;color:#111827}.secondary{background:#374151}.danger{background:#7f1d1d}
.settings{margin-top:8px}
.settings>button{width:100%;border:0;border-radius:10px;background:#374151;padding:9px;font-weight:800}
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:10px}
.backdrop.open{display:flex}
.modal{width:min(520px,100%);max-height:92dvh;overflow:auto;background:#1f2937;border:1px solid #4b5563;border-radius:16px;padding:13px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.modal-title{font-size:17px;font-weight:900}.close{width:36px;height:36px;border:0;border-radius:9px;background:#374151;font-size:22px}
.form{display:grid;gap:8px}.form label{display:grid;gap:4px;font-size:12px;color:#d1d5db}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.event-list{display:grid;gap:6px;margin:8px 0}
.event-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;background:#111827;border:1px solid #374151;border-radius:9px;padding:8px}
.event-text{font-size:12px;overflow:hidden}
.event-item button{border:0;border-radius:8px;background:#4b5563;padding:7px}
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.month-grid button{border:1px solid #4b5563;border-radius:9px;background:#111827;padding:11px 4px}
.rate-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:7px}
.rate-row label{font-size:10px;color:#d1d5db}
.backup{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.backup label,.backup button{display:flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:#374151;padding:9px;font-weight:800}
.backup input{display:none}
@media(max-width:480px){.panel{padding-left:4px;padding-right:4px}.summary{flex-basis:145px}}

/* カレンダーの見えている四隅を確実に角丸にする */
#planPanel .calendar,
#salaryPanel .calendar{
  border-radius:18px !important;
  overflow:hidden !important;
  border:1px solid #374151 !important;
  isolation:isolate;
}
#planPanel .cal-head,
#salaryPanel .cal-head{
  border-radius:17px 17px 0 0 !important;
}
#planPanel .grid,
#salaryPanel .grid{
  border-radius:0 0 17px 17px !important;
  overflow:hidden !important;
}
#planPanel .grid > :nth-last-child(7),
#salaryPanel .grid > :nth-last-child(7){
  border-bottom-left-radius:17px !important;
}
#planPanel .grid > :last-child,
#salaryPanel .grid > :last-child{
  border-bottom-right-radius:17px !important;
}


/* 操作中の拡大を抑止 */
html,body{touch-action:pan-x !important;-webkit-text-size-adjust:100% !important}

/* 予定カレンダー：予定を帯表示 */
#planPanel .day{padding:20px 4px 3px !important}
#planPanel .entry{
  display:flex !important;
  flex-direction:column !important;
  justify-content:center !important;
  width:100% !important;
  min-width:0 !important;
  min-height:27px !important;
  margin:2px 0 0 !important;
  padding:3px 4px !important;
  border-left:0 !important;
  border-radius:4px !important;
  background:#365b86 !important;
  color:#fff !important;
  overflow:hidden !important;
  white-space:normal !important;
  line-height:1.05 !important;
}
#planPanel .entry strong{
  display:block !important;
  width:100% !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
  white-space:nowrap !important;
  font-size:8px !important;
  line-height:1.05 !important;
}
#planPanel .entry .entry-time{
  display:block !important;
  width:100% !important;
  font-size:7px !important;
  line-height:1.1 !important;
  white-space:nowrap !important;
  letter-spacing:-.25px !important;
  transform:scaleX(.88);
  transform-origin:left center;
  width:113.6% !important;
}

/* 給与カレンダー：日額をセル内に表示 */
#salaryPanel .day-pay{
  display:block;
  margin-top:2px;
  font-size:8px;
  font-weight:800;
  color:#d1d5db;
  white-space:nowrap;
}


/* 復元機能：月合計・給料日・勉強会終了時刻・詳細タイムライン */
.month-total{
  flex:0 0 auto;
  padding:5px 8px;
  border-top:1px solid #374151;
  background:#1f2937;
  text-align:right;
  font-size:11px;
  font-weight:800;
}
.payday-badge{
  position:absolute;
  top:4px;
  right:4px;
  padding:1px 3px;
  border-radius:4px;
  background:#374151;
  font-size:7px;
  font-weight:900;
  color:#f9fafb;
}
.payday-amount{
  position:absolute;
  top:15px;
  right:3px;
  z-index:3;
  display:block;
  max-width:calc(100% - 6px);
  padding:1px 2px;
  border:0;
  border-radius:3px;
  background:rgba(6,78,59,.72);
  color:#a7f3d0;
  font-size:5.8px;
  font-weight:900;
  line-height:1.05;
  letter-spacing:-.35px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
  pointer-events:none;
}
.study-end{
  font-size:11px;
  color:#cbd5e1;
  white-space:nowrap;
}
.detail-timeline{
  display:grid;
  grid-template-columns:34px minmax(0,1fr);
  height:360px;
  margin:10px 0 12px;
  border:1px solid #374151;
  border-radius:12px;
  overflow:hidden;
  background:#111827;
}
.detail-hours{position:relative;border-right:1px solid #374151;color:#9ca3af;font-size:8px}
.detail-hours span{position:absolute;right:4px;transform:translateY(-50%)}
.detail-hours span:first-child{top:0;transform:none}
.detail-hours span:last-child{bottom:0;transform:none}
.detail-track{
  position:relative;
  min-width:0;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(8.333333% - 1px),#263244 calc(8.333333% - 1px),#263244 8.333333%);
}
.detail-band{
  position:absolute;
  left:4px;
  right:4px;
  min-height:22px;
  padding:3px 5px;
  border-left:3px solid #7dd3fc;
  border-radius:5px;
  background:#365b86;
  color:#fff;
  overflow:hidden;
  font-size:9px;
  line-height:1.15;
}
.detail-band strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-band span{display:block;font-size:8px;white-space:nowrap}
.detail-band{z-index:3}
.detail-band-all-day{
  top:0!important;
  height:100%!important;
  min-height:100%!important;
  z-index:1!important;
  border-left-color:#f9fafb!important;
  background:rgba(75,85,99,.38)!important;
}
.detail-band-all-day strong,
.detail-band-all-day span{
  position:relative;
  z-index:2;
}
.rate-row{
  grid-template-columns:1.15fr .8fr .8fr .8fr auto !important;
  align-items:end;
}
.rate-delete{
  border:0;
  border-radius:8px;
  background:#7f1d1d;
  color:#fff;
  padding:8px;
  font-weight:800;
}
@media(max-width:480px){
  .rate-row{grid-template-columns:1fr 1fr !important}
  .rate-delete{grid-column:1/-1}
}


/* 10 requested fixes */
html,body{width:100%;max-width:100%;height:100%;overflow:hidden!important;overscroll-behavior:none!important}

/* larger monthly salary summary */
.month-total{padding:9px 10px!important;text-align:left!important}
.total-main{font-size:17px!important;font-weight:900!important}

/* latest control sizing/layout fixes */
.actions{display:flex!important;justify-content:flex-end!important;gap:8px!important}

/* compact start/end controls */

.panel-title-row{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.panel-title-row h1{margin:2px 0 6px}
.gear{position:absolute;right:2px;top:0;width:32px;height:28px;border:0;border-radius:8px;background:transparent;color:#d1d5db;font-size:19px;font-weight:800;padding:0}
.settings-section{padding:10px 0;border-bottom:1px solid #374151}
.settings-section:last-child{border-bottom:0}
.settings-heading{font-size:13px;font-weight:900;margin-bottom:8px}
.settings-note{font-size:11px;color:#9ca3af}
.notify-row{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center}
.notify-switch{font-size:13px;font-weight:800;color:#f3f4f6}
#notifyTime{width:110px;height:34px}
#notifyStatus{margin-top:7px}
.gear{right:2px!important;top:-4px!important;width:44px!important;height:38px!important;font-size:28px!important;line-height:38px!important}
.today-image-preview{
  position:relative;
  width:min(180px,100%);
  max-width:100%;
  aspect-ratio:1 / 1;
  height:auto!important;
  border:1px solid #4b5563;
  border-radius:10px;
  background:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9ca3af;
  font-size:12px;
  margin-bottom:8px;
  overflow:hidden;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
.today-image-preview.dragging{cursor:grabbing}
.today-image-preview::after{
  content:"ドラッグ・ピンチで調整";
  position:absolute;
  left:5px;
  right:5px;
  bottom:5px;
  z-index:4;
  padding:3px 5px;
  border-radius:5px;
  background:rgba(0,0,0,.58);
  color:#fff;
  font-size:9px;
  font-weight:800;
  text-align:center;
  pointer-events:none;
}
.today-image-preview.no-media::after{display:none}
.today-image-preview img,
.today-image-preview video,
.today-media-visual{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  pointer-events:none!important;
  display:block!important;
  will-change:transform;
}
.today-image-preview img,
.today-image-preview video{
  z-index:1;
}
.today-media-visual{
  z-index:0!important;
  filter:brightness(.72);
}
.day.today.has-custom-media > .entry,
.day.today.has-custom-media > .day-pay{
  position:relative;
  z-index:1;
}
.day.today.has-custom-media > .daynum{
  position:absolute;
  left:5px;
  top:5px;
  z-index:2;
}
.day.today.has-custom-media > .weather-mini,
.day.today.has-custom-media > .payday-badge,
.day.today.has-custom-media > .payday-amount{
  z-index:2;
}
.day.today.has-custom-image{
  background-image:none!important;

<script>


const TODAY_IMAGE_KEY="calendar_today_image_v1";
const TODAY_MEDIA_TYPE_KEY="calendar_today_media_type_v1";
const TODAY_GIF_KEY="calendar_today_gif_v1";
const TODAY_MEDIA_POS_X_KEY="calendar_today_media_pos_x_v1";
const TODAY_MEDIA_POS_Y_KEY="calendar_today_media_pos_y_v1";
const TODAY_MEDIA_ZOOM_KEY="calendar_today_media_zoom_v1";
const TODAY_MEDIA_DB="calendar_today_media_db_v1";
const TODAY_MEDIA_STORE="media";
let todayVideoObjectUrl="";
let todayGifObjectUrl="";

function getTodayImage(){return localStorage.getItem(TODAY_IMAGE_KEY)||""}
function getTodayGif(){return localStorage.getItem(TODAY_GIF_KEY)||""}
function clampTodayMediaPos(v){return Math.max(0,Math.min(100,Number(v)||0))}
function getTodayMediaPosition(){
 const x=localStorage.getItem(TODAY_MEDIA_POS_X_KEY);
 const y=localStorage.getItem(TODAY_MEDIA_POS_Y_KEY);
 return {
   x:x==null?50:clampTodayMediaPos(x),
   y:y==null?50:clampTodayMediaPos(y)
 };
}
function setTodayMediaPosition(x,y){
 localStorage.setItem(TODAY_MEDIA_POS_X_KEY,String(clampTodayMediaPos(x)));
 localStorage.setItem(TODAY_MEDIA_POS_Y_KEY,String(clampTodayMediaPos(y)));
}
function todayMediaPositionCSS(){
 const p=getTodayMediaPosition();
 return `${p.x}% ${p.y}%`;
}
function clampTodayMediaZoom(v){return Math.max(1,Math.min(3,Number(v)||1))}
function getTodayMediaZoom(){
 const v=localStorage.getItem(TODAY_MEDIA_ZOOM_KEY);
 return v==null?1:clampTodayMediaZoom(v);
}
function setTodayMediaZoom(v){
 const z=clampTodayMediaZoom(v);
 localStorage.setItem(TODAY_MEDIA_ZOOM_KEY,String(z));
 return z;
}
function applyTodayMediaFramingToElement(el){
 if(!el)return;
 const p=getTodayMediaPosition();
 const z=getTodayMediaZoom();
 const pos=`${p.x}% ${p.y}%`;
 el.style.objectPosition=pos;
 el.style.transformOrigin=pos;
 el.style.transform=`scale(${z})`;
}
function updateTodayZoomUI(){
 const z=getTodayMediaZoom();
 if(typeof todayMediaZoom!=="undefined"&&todayMediaZoom)todayMediaZoom.value=String(z);
 if(typeof todayMediaZoomValue!=="undefined"&&todayMediaZoomValue)todayMediaZoomValue.textContent=`${z.toFixed(2)}×`;
}
let todayPreviewTarget="plan";
function syncTodayPreviewAspect(target=todayPreviewTarget){
 todayPreviewTarget=target==="salary"?"salary":"plan";
 const panel=todayPreviewTarget==="salary"?salaryPanel:planPanel;
 const cell=panel?.querySelector(".grid .day");
 if(!cell||!todayImagePreview)return;
 const r=cell.getBoundingClientRect();
 if(r.width>0&&r.height>0)todayImagePreview.style.aspectRatio=`${r.width} / ${r.height}`;
}

function detectTodayMediaType(file){
 const type=String(file?.type||"").toLowerCase();
 if(type==="image/gif")return "gif";
 if(type.startsWith("image/"))return "image";
 if(type.startsWith("video/"))return "video";
 const ext=String(file?.name||"").split(".").pop().toLowerCase();
 if(ext==="gif")return "gif";
 if(["jpg","jpeg","png","webp","heic","heif","avif","bmp"].includes(ext))return "image";
 if(["mp4","mov","m4v","webm","avi","mpeg","mpg"].includes(ext))return "video";
 return "";
}

function openTodayMediaDB(){
 return new Promise((resolve,reject)=>{
   const req=indexedDB.open(TODAY_MEDIA_DB,1);
   req.onupgradeneeded=()=>{
     const db=req.result;
     if(!db.objectStoreNames.contains(TODAY_MEDIA_STORE))db.createObjectStore(TODAY_MEDIA_STORE);
   };
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error);
 });
}

async function putTodayVideoBlob(file){
 const db=await openTodayMediaDB();
 await new Promise((resolve,reject)=>{
   const tx=db.transaction(TODAY_MEDIA_STORE,"readwrite");
   tx.objectStore(TODAY_MEDIA_STORE).put(file,"today-video");
   tx.oncomplete=resolve;
   tx.onerror=()=>reject(tx.error);
   tx.onabort=()=>reject(tx.error);
 });
 db.close();
}

async function getTodayVideoBlob(){
 try{
   const db=await openTodayMediaDB();
   const blob=await new Promise((resolve,reject)=>{
     const tx=db.transaction(TODAY_MEDIA_STORE,"readonly");
     const req=tx.objectStore(TODAY_MEDIA_STORE).get("today-video");
     req.onsuccess=()=>resolve(req.result||null);
     req.onerror=()=>reject(req.error);
   });
   db.close();
   return blob;
 }catch{return null}
}

async function putTodayGifBlob(file){
 const db=await openTodayMediaDB();
 await new Promise((resolve,reject)=>{
   const tx=db.transaction(TODAY_MEDIA_STORE,"readwrite");
   tx.objectStore(TODAY_MEDIA_STORE).put(file,"today-gif");
   tx.oncomplete=resolve;
   tx.onerror=()=>reject(tx.error);
   tx.onabort=()=>reject(tx.error);
 });
 db.close();
}

async function getTodayGifBlob(){
 try{
   const db=await openTodayMediaDB();
   const blob=await new Promise((resolve,reject)=>{
     const tx=db.transaction(TODAY_MEDIA_STORE,"readonly");
     const req=tx.objectStore(TODAY_MEDIA_STORE).get("today-gif");
     req.onsuccess=()=>resolve(req.result||null);
     req.onerror=()=>reject(req.error);
   });
   db.close();
   return blob;
 }catch{return null}
}

async function deleteTodayGifBlob(){
 try{
   const db=await openTodayMediaDB();
   await new Promise((resolve,reject)=>{
     const tx=db.transaction(TODAY_MEDIA_STORE,"readwrite");
     tx.objectStore(TODAY_MEDIA_STORE).delete("today-gif");
     tx.oncomplete=resolve;
     tx.onerror=()=>reject(tx.error);
     tx.onabort=()=>reject(tx.error);
   });
   db.close();
 }catch{}
}

function resetTodayGifObjectUrl(){
 if(todayGifObjectUrl){
   URL.revokeObjectURL(todayGifObjectUrl);
   todayGifObjectUrl="";
 }
}

async function getTodayGifUrl(){
 if(todayGifObjectUrl)return todayGifObjectUrl;
 const blob=await getTodayGifBlob();
 if(!blob)return "";
 todayGifObjectUrl=URL.createObjectURL(blob);
 return todayGifObjectUrl;
}

async function deleteTodayVideoBlob(){
 try{
   const db=await openTodayMediaDB();
   await new Promise((resolve,reject)=>{
     const tx=db.transaction(TODAY_MEDIA_STORE,"readwrite");
     tx.objectStore(TODAY_MEDIA_STORE).delete("today-video");
     tx.oncomplete=resolve;
     tx.onerror=()=>reject(tx.error);
     tx.onabort=()=>reject(tx.error);
   });
   db.close();
 }catch{}
}

function resetTodayVideoObjectUrl(){
 if(todayVideoObjectUrl){
   URL.revokeObjectURL(todayVideoObjectUrl);
   todayVideoObjectUrl="";
 }
}

async function getTodayVideoUrl(){
 if(todayVideoObjectUrl)return todayVideoObjectUrl;
 const blob=await getTodayVideoBlob();
 if(!blob)return "";
 todayVideoObjectUrl=URL.createObjectURL(blob);
 return todayVideoObjectUrl;
}

function makeLoopVideo(src){
 const video=document.createElement("video");
 video.src=src;
 video.autoplay=true;
 video.loop=true;
 video.muted=true;
 video.defaultMuted=true;
 video.playsInline=true;
 video.setAttribute("playsinline","");
 video.setAttribute("webkit-playsinline","");
 video.preload="auto";
 applyTodayMediaFramingToElement(video);
 video.addEventListener("canplay",()=>video.play().catch(()=>{}),{once:true});
 return video;
}

async function refreshTodayImagePreview(){
 todayImagePreview.innerHTML="";
 todayImagePreview.classList.add("no-media");
 todayImagePreview.style.backgroundImage="";
 const mediaType=localStorage.getItem(TODAY_MEDIA_TYPE_KEY)|| (getTodayImage()?"image":"");
 updateTodayZoomUI();

 if(mediaType==="video"){
   const src=await getTodayVideoUrl();
   if(src){
     const video=makeLoopVideo(src);
     todayImagePreview.classList.remove("no-media");
     todayImagePreview.appendChild(video);
     video.play().catch(()=>{});
     return;
   }
 }

 if(mediaType==="gif"){
   const src=await getTodayGifUrl();
   if(src){
     const img=document.createElement("img");
     img.alt="";
     img.src=src;
     applyTodayMediaFramingToElement(img);
     todayImagePreview.classList.remove("no-media");
     todayImagePreview.appendChild(img);
     return;
   }
 }

 if(mediaType==="image"){
   const src=getTodayImage();
   if(src){
     const img=document.createElement("img");
     img.alt="";
     img.src=src;
     applyTodayMediaFramingToElement(img);
     todayImagePreview.classList.remove("no-media");
     todayImagePreview.appendChild(img);
     return;
   }
 }

 todayImagePreview.textContent="画像・動画なし";
}
async function applyTodayImage(){
 const mediaType=localStorage.getItem(TODAY_MEDIA_TYPE_KEY)|| (getTodayImage()?"image":"");
 const imageSrc=mediaType==="image"?getTodayImage():"";
 const gifSrc=mediaType==="gif"?await getTodayGifUrl():"";
 const videoSrc=mediaType==="video"?await getTodayVideoUrl():"";

 document.querySelectorAll(".day.today").forEach(el=>{
   el.querySelectorAll(".today-media-visual").forEach(v=>v.remove());
   el.classList.remove("has-custom-image","has-custom-video","has-custom-media");
   el.style.backgroundImage="";

   let media=null;
   if(videoSrc){
     media=makeLoopVideo(videoSrc);
     media.className="today-media-visual today-media-video";
     el.classList.add("has-custom-video","has-custom-media");
   }else if(imageSrc||gifSrc){
     media=document.createElement("img");
     media.src=imageSrc||gifSrc;
     media.alt="";
     media.className="today-media-visual today-media-image";
     el.classList.add("has-custom-image","has-custom-media");
   }

   if(media){
     applyTodayMediaFramingToElement(media);
     el.prepend(media);
     if(media.tagName==="VIDEO")media.play().catch(()=>{});
   }
 });
}
async function saveTodayMediaFile(file){
 if(!file)return;
 const mediaType=detectTodayMediaType(file);

(function setupTodayMediaPositionEditor(){
 const pointers=new Map();
 let dragBase=null,pinchBase=null;

 function hasTodayMedia(){
   return !!(localStorage.getItem(TODAY_MEDIA_TYPE_KEY)||getTodayImage());
 }

 function applyFramingLive(){
   updateTodayZoomUI();
   todayImagePreview.querySelectorAll("img,video").forEach(applyTodayMediaFramingToElement);
   document.querySelectorAll(".day.today .today-media-visual").forEach(applyTodayMediaFramingToElement);
 }

 function beginSingle(pointer){
   const p=getTodayMediaPosition();
   dragBase={x:pointer.x,y:pointer.y,posX:p.x,posY:p.y};
   pinchBase=null;
 }

 function beginPinch(){
   if(pointers.size<2)return;
   const a=[...pointers.values()].slice(0,2);
   pinchBase={
     distance:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)||1,
     zoom:getTodayMediaZoom()
   };
   dragBase=null;
 }

 todayImagePreview.addEventListener("pointerdown",e=>{
   if(!hasTodayMedia())return;
   pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
   todayImagePreview.setPointerCapture?.(e.pointerId);
   todayImagePreview.classList.add("dragging");
   if(pointers.size===1)beginSingle({x:e.clientX,y:e.clientY});
   else beginPinch();
   e.preventDefault();
 });

 todayImagePreview.addEventListener("pointermove",e=>{
   if(!pointers.has(e.pointerId))return;
   pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

   if(pointers.size>=2){
     if(!pinchBase)beginPinch();
     const a=[...pointers.values()].slice(0,2);
     const distance=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)||1;
     setTodayMediaZoom(pinchBase.zoom*(distance/pinchBase.distance));
     applyFramingLive();
     e.preventDefault();
     return;
   }

   if(dragBase){
     const rect=todayImagePreview.getBoundingClientRect();
     const dx=e.clientX-dragBase.x;
     const dy=e.clientY-dragBase.y;
     const x=dragBase.posX-(dx/Math.max(1,rect.width))*100;
     const y=dragBase.posY-(dy/Math.max(1,rect.height))*100;
     setTodayMediaPosition(x,y);
     applyFramingLive();
     e.preventDefault();
   }
 });

 function releasePointer(e){
   pointers.delete(e.pointerId);
   try{todayImagePreview.releasePointerCapture?.(e.pointerId)}catch{}
   if(pointers.size===1){
     const one=[...pointers.values()][0];
     beginSingle(one);
   }else if(pointers.size===0){
     dragBase=null;
     pinchBase=null;
     todayImagePreview.classList.remove("dragging");
   }else{
     beginPinch();
   }
 }
 todayImagePreview.addEventListener("pointerup",releasePointer);
 todayImagePreview.addEventListener("pointercancel",releasePointer);

 todayMediaZoom.addEventListener("input",()=>{
   setTodayMediaZoom(todayMediaZoom.value);
   applyFramingLive();
 });
})();

function weatherLabel(code){

(function setupPlanDetailSwipe(){
 const modal=planDetail.querySelector(".modal");
 if(!modal)return;

 let active=false,horizontal=false,sx=0,sy=0,lastDx=0,startAt=0;

 modal.addEventListener("touchstart",e=>{
   if(e.touches.length!==1)return;
   if(e.target.closest("button,input,textarea,select,a"))return;
   active=true;
   horizontal=false;
   sx=e.touches[0].clientX;
   sy=e.touches[0].clientY;
   lastDx=0;
   startAt=performance.now();
   modal.style.transition="none";
 },{passive:true});

 modal.addEventListener("touchmove",e=>{
   if(!active||e.touches.length!==1)return;
   const dx=e.touches[0].clientX-sx;
   const dy=e.touches[0].clientY-sy;

   if(!horizontal){
     if(Math.abs(dx)<8)return;
     if(Math.abs(dx)<=Math.abs(dy)*1.15){
       active=false;
       modal.style.transform="";
       return;
     }
     horizontal=true;
   }

   e.preventDefault();
   lastDx=dx;
   modal.style.transform=`translate3d(${dx}px,0,0)`;
 },{passive:false});

 function finish(){
   if(!active)return;
   active=false;
   const elapsed=Math.max(1,performance.now()-startAt);
   const speed=Math.abs(lastDx)/elapsed;
   const go=Math.abs(lastDx)>=48||speed>=0.38;

   modal.style.transition="transform 140ms ease";
   modal.style.transform="translate3d(0,0,0)";
   setTimeout(()=>{modal.style.transition="";modal.style.transform=""},150);

   if(!horizontal||!go)return;
   if(lastDx<0)shiftPlanDetailDay(1);
   else shiftPlanDetailDay(-1);
 }

 modal.addEventListener("touchend",finish,{passive:true});
 modal.addEventListener("touchcancel",()=>{
   active=false;
   horizontal=false;
   lastDx=0;
   modal.style.transition="transform 120ms ease";
   modal.style.transform="translate3d(0,0,0)";
   setTimeout(()=>{modal.style.transition="";modal.style.transform=""},130);
 },{passive:true});
})();

/* 予定⇔給与：カレンダー外で始まったスワイプだけ画面切替 */
let pagerSettleTimer=0;
let pageIndex=0;
let pageSwipeActive=false,pageSwipeHorizontal=false;
let pageSX=0,pageSY=0,pageLastDx=0,pageStartAt=0;

function goPage(index,animated=true){
  pageIndex=Math.max(0,Math.min(1,index));
  const left=pageIndex*pager.clientWidth;
  pager.scrollTo({left,behavior:animated?"smooth":"auto"});
}

pager.addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;

  /* カレンダー上で始まった操作は、画面切替処理に一切入れない */
  if(e.target.closest(".calendar")){
    pageSwipeActive=false;
    return;
  }

  pageSwipeActive=true;
  pageSwipeHorizontal=false;
  pageSX=e.touches[0].clientX;
  pageSY=e.touches[0].clientY;
  pageLastDx=0;
  pageStartAt=performance.now();
},{passive:true});

pager.addEventListener("touchmove",e=>{
  if(!pageSwipeActive||e.touches.length!==1)return;

  const dx=e.touches[0].clientX-pageSX;
  const dy=e.touches[0].clientY-pageSY;

  if(!pageSwipeHorizontal && Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)*1.12){
    pageSwipeHorizontal=true;
  }
  if(!pageSwipeHorizontal)return;

  e.preventDefault();
  pageLastDx=dx;

  const w=Math.max(1,pager.clientWidth);
  const base=pageIndex*w;
  const target=Math.max(0,Math.min(w,base-dx));
  pager.scrollLeft=target;
},{passive:false});

pager.addEventListener("touchend",e=>{
  if(!pageSwipeActive)return;
  pageSwipeActive=false;

  if(!pageSwipeHorizontal){
    goPage(pageIndex,true);
    return;
  }

  e.preventDefault();
  const t=e.changedTouches[0];
  const dx=t.clientX-pageSX;
  const dy=t.clientY-pageSY;
  const elapsed=Math.max(1,performance.now()-pageStartAt);
  const speed=Math.abs(dx)/elapsed;

  const horizontal=Math.abs(dx)>Math.abs(dy)*1.12;
  const enough=Math.abs(dx)>=Math.max(55,pager.clientWidth*.14);
  const flick=Math.abs(dx)>=18 && speed>=0.32;

  if(horizontal && (enough||flick)){
    if(dx<0)goPage(pageIndex+1,true);
    else goPage(pageIndex-1,true);
  }else{
    goPage(pageIndex,true);
  }

  pageSwipeHorizontal=false;
  pageLastDx=0;
},{passive:false});

pager.addEventListener("touchcancel",()=>{
  pageSwipeActive=false;
  pageSwipeHorizontal=false;
  goPage(pageIndex,true);
},{passive:true});

/* Macの横スクロールもカレンダー外だけ画面切替 */
let pageWheelLock=false,pageWheelTimer=0;
pager.addEventListener("wheel",e=>{
  if(e.target.closest(".calendar"))return;
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)*1.1 || Math.abs(e.deltaX)<10)return;

  e.preventDefault();
  clearTimeout(pageWheelTimer);
  pageWheelTimer=setTimeout(()=>{pageWheelLock=false},420);
  if(pageWheelLock)return;
  pageWheelLock=true;

  if(e.deltaX>0)goPage(pageIndex+1,true);
  else goPage(pageIndex-1,true);
},{passive:false});

  calendar.dataset.monthAnimating="1";
  const grid=calendar.querySelector(".grid");
  if(!grid){move();delete calendar.dataset.monthAnimating;return}

  const width=Math.max(1,calendar.clientWidth||grid.clientWidth||1);
  const out=dir>0?-1:1;
  const previousOverflow=calendar.style.overflow;
  calendar.style.overflow="hidden";

  let exitAnim=null,enterAnim=null,moved=false,done=false;

  const cleanup=()=>{
    const current=calendar.querySelector(".grid");
    if(current)current.style.transform="";
    grid.style.transform="";
    calendar.style.overflow=previousOverflow;
    delete calendar.dataset.monthAnimating;
    calendar._finishMonthAnimation=null;
  };

  const forceFinish=()=>{
    if(done)return;
    done=true;
    exitAnim?.cancel();
    if(!moved){
      grid.style.transform="";
      move();
      moved=true;
    }
    enterAnim?.cancel();
    cleanup();
  };
  calendar._finishMonthAnimation=forceFinish;

  exitAnim=grid.animate(
    [{transform:`translate3d(${startPx}px,0,0)`},{transform:`translate3d(${out*width}px,0,0)`}],
    {duration:startPx?105:135,easing:"cubic-bezier(.4,0,.6,1)"}
  );

  exitAnim.finished.catch(()=>{}).then(()=>{
    if(done)return;
    exitAnim.cancel();
    grid.style.transform="";
    move();
    moved=true;

    const nextGrid=calendar.querySelector(".grid");
    if(!nextGrid){done=true;cleanup();return}

    enterAnim=nextGrid.animate(
      [{transform:`translate3d(${-out*width}px,0,0)`},{transform:"translate3d(0,0,0)"}],
      {duration:155,easing:"cubic-bezier(.22,.75,.25,1)"}
    );

    enterAnim.finished.catch(()=>{}).then(()=>{
      if(done)return;
      done=true;
      enterAnim.cancel();
      cleanup();
    });
  });
}

/* カレンダー枠内：月スワイプ専用。画面スワイプ判定は入れない。 */
(function(){
 function bind(el,move){
   if(!el||el.dataset.monthSwipe)return;
   el.dataset.monthSwipe="1";

   let sx=0,sy=0,lastDx=0,startAt=0,active=false,horizontal=false;
   let wheelLocked=false,wheelUnlockTimer=0;

   const grid=()=>el.querySelector(".grid");

   function resetDrag(animated=true){
     const g=grid();
     if(!g)return;
     const from=lastDx;
     if(!animated||Math.abs(from)<1){
       g.style.transform="";
       lastDx=0;
       return;
     }
     const back=g.animate(
       [{transform:`translate3d(${from}px,0,0)`},{transform:"translate3d(0,0,0)"}],
       {duration:120,easing:"cubic-bezier(.22,.75,.25,1)"}
     );
     back.finished.catch(()=>{}).then(()=>{
       back.cancel();
       g.style.transform="";
       lastDx=0;
     });
   }

   el.addEventListener("touchstart",e=>{
     if(e.touches.length!==1)return;

     /* 前の月移動が残っていれば即完了して、次のスワイプを捨てない */
     finishMonthAnimation(el);
     e.stopPropagation();

     /* 直前の予定⇔給与スライドのsmooth移動をここで完全停止 */
     const pageW=pager.clientWidth;
     if(pageW){
       pager.scrollTo({left:pageIndex*pageW,behavior:"auto"});
       pager.scrollLeft=pageIndex*pageW;
     }

     sx=e.touches[0].clientX;
     sy=e.touches[0].clientY;
     startAt=performance.now();
     lastDx=0;
     active=true;
     horizontal=false;
   },{passive:true});

   el.addEventListener("touchmove",e=>{
     if(!active||e.touches.length!==1)return;
     e.stopPropagation();

     const dx=e.touches[0].clientX-sx;
     const dy=e.touches[0].clientY-sy;

     if(!horizontal && Math.abs(dx)>6 && Math.abs(dx)>Math.abs(dy)*1.08){
       horizontal=true;
     }
     if(!horizontal)return;

     e.preventDefault();

     const g=grid();
     if(!g)return;
     const width=Math.max(1,el.clientWidth||g.clientWidth||1);
     const limit=width*.92;
     lastDx=Math.max(-limit,Math.min(limit,dx));
     g.style.transform=`translate3d(${lastDx}px,0,0)`;
   },{passive:false});

   el.addEventListener("touchend",e=>{
     if(!active)return;
     active=false;
     e.stopPropagation();

     const t=e.changedTouches[0];
     const dx=t.clientX-sx;
     const dy=t.clientY-sy;
     const elapsed=Math.max(1,performance.now()-startAt);
     const speed=Math.abs(dx)/elapsed;

     const directionIsHorizontal=Math.abs(dx)>Math.abs(dy)*1.08;
     const distanceEnough=Math.abs(dx)>=45;
     const fastFlick=Math.abs(dx)>=16 && speed>=0.32;
     const valid=horizontal && directionIsHorizontal && (distanceEnough||fastFlick);

     if(valid){
       e.preventDefault();
       const d=dx<0?1:-1;
       const startPx=lastDx;
       lastDx=0;
       move(d,startPx);
     }else{
       resetDrag(true);
     }
     horizontal=false;
   },{passive:false});

   el.addEventListener("touchcancel",e=>{
     active=false;
     horizontal=false;
     e.stopPropagation();
     resetDrag(true);
   },{passive:true});

   el.addEventListener("wheel",e=>{
     if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)*1.1 || Math.abs(e.deltaX)<8)return;
     e.preventDefault();
     e.stopPropagation();

     clearTimeout(wheelUnlockTimer);
     wheelUnlockTimer=setTimeout(()=>{wheelLocked=false},420);

     if(wheelLocked)return;
     wheelLocked=true;
     move(e.deltaX>0?1:-1,0);
   },{passive:false});
 }

 const planCal=document.querySelector("#planPanel .calendar");
 const salaryCal=document.querySelector("#salaryPanel .calendar");

 bind(planCal,(d,startPx=0)=>animateMonth(planCal,d,()=>{
   planView=new Date(planView.getFullYear(),planView.getMonth()+d,1);
   renderPlan();
 },startPx));

 bind(salaryCal,(d,startPx=0)=>animateMonth(salaryCal,d,()=>{
   salView=new Date(salView.getFullYear(),salView.getMonth()+d,1);
   renderSalary();
 },startPx));
})();
