<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="calendar-build" content="1789044184">
<title>カレンダー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:#f9fafb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{color:inherit}
.wrap{width:100%;height:100dvh;overflow:hidden}
.pager{display:flex;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.pager::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;width:100%;min-width:100%;height:100%;padding:4px 8px 8px;overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column}
h1{font-size:17px;text-align:center;margin:2px 0 6px;flex:0 0 auto}
.panel-title{position:relative;flex:0 0 auto}
.panel-title h1{margin:2px 44px 6px}
.top-settings{position:absolute;right:0;top:0;height:28px;border:0;border-radius:8px;background:#374151;padding:0 9px;font-size:11px;font-weight:800;z-index:5}
.card{background:#1f2937;border:1px solid #374151;border-radius:16px;overflow:hidden}
.calendar{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.cal-head{position:relative;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:7px 9px;border-bottom:1px solid #374151;flex:0 0 auto}
.nav{width:34px;height:30px;border:0;border-radius:9px;background:#374151;font-size:20px;font-weight:800}
.month{width:100%;border:0;background:transparent;text-align:center;font-size:16px;font-weight:900;padding:4px 0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid #374151;flex:0 0 25px}
.week div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border-right:1px solid #374151}
.week div:last-child{border-right:0}
.week div:first-child{color:#ff5f67}.week div:last-child{color:#5aa7ff}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));flex:1 1 auto;min-height:0;background:#111827}
.day,.blank{position:relative;min-width:0;min-height:0;border:0;border-right:1px solid #374151;border-bottom:1px solid #374151;background:#111827;overflow:hidden}
.grid>:nth-child(7n){border-right:0}
.grid>:nth-last-child(-n+7){border-bottom:0}
.day{padding:21px 3px 3px;text-align:left}
.daynum{position:absolute;left:5px;top:5px;font-size:12px;font-weight:700;line-height:1}
.holiday .daynum{color:#ff5f67}.saturday .daynum{color:#5aa7ff}
.today{background:#3b475a}
.selected{background:#1d4ed8;box-shadow:inset 0 0 0 2px #7dd3fc}
.memo-dot{position:absolute;top:4px;right:4px;font-size:8px}
.entry{display:block;overflow:hidden;margin-top:1px;white-space:nowrap;text-overflow:ellipsis;font-size:8px;font-weight:700;line-height:1.2;color:#d1d5db}
.entry strong{color:#fff}
.summary{flex:0 0 145px;margin-top:7px;padding:9px 10px;overflow:auto}
.summary-title{font-size:13px;font-weight:900;margin-bottom:6px}
.summary-row{display:flex;gap:9px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}
.summary-time{color:#cbd5e1;flex:0 0 auto;font-variant-numeric:tabular-nums}
.summary-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary-empty{font-size:12px;color:#9ca3af}
.summary-memo{font-size:11px;color:#cbd5e1;margin-top:7px}
.salary-calendar{flex:0 0 54%;min-height:0}
.controls{flex:1 1 auto;min-height:0;margin-top:7px;padding:9px 10px;overflow:auto}
.selected-date{font-size:13px;font-weight:800;margin-bottom:7px}
.slot-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.slot{border:1px solid #4b5563;background:#111827;border-radius:8px;padding:7px 1px;font-size:14px;font-weight:900}
.slot.active{background:#f9fafb;color:#111827}
.study-row{display:grid;grid-template-columns:auto 1fr;gap:7px;margin-top:8px;align-items:center}
.study-toggle{border:1px solid #4b5563;background:#111827;border-radius:9px;padding:8px;font-weight:800}
.study-toggle.active{background:#f9fafb;color:#111827}
.study-fields{display:none;grid-template-columns:72px 1fr;gap:6px;align-items:center}
.study-fields.active{display:grid}
input[type=time],input[type=number],input[type=text],textarea{width:100%;min-width:0;border:1px solid #4b5563;border-radius:8px;background:#111827;color:#fff;padding:7px;font-size:16px}
.preview{background:#111827;border-radius:10px;padding:7px 9px;margin-top:8px}
.preview small{color:#9ca3af}.preview strong{display:block;font-size:19px;margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.actions button,.primary,.secondary,.danger{border:0;border-radius:10px;padding:9px;font-weight:800}
.primary{background:#f9fafb;color:#111827}.secondary{background:#374151}.danger{background:#7f1d1d}
.settings{margin-top:8px}
.settings>button{width:100%;border:0;border-radius:10px;background:#374151;padding:9px;font-weight:800}
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:10px}
.backdrop.open{display:flex}
.modal{width:min(520px,100%);max-height:92dvh;overflow:auto;background:#1f2937;border:1px solid #4b5563;border-radius:16px;padding:13px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.modal-title{font-size:17px;font-weight:900}.close{width:36px;height:36px;border:0;border-radius:9px;background:#374151;font-size:22px}
.form{display:grid;gap:8px}.form label{display:grid;gap:4px;font-size:12px;color:#d1d5db}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.event-list{display:grid;gap:6px;margin:8px 0}
.event-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;background:#111827;border:1px solid #374151;border-radius:9px;padding:8px}
.event-text{font-size:12px;overflow:hidden}
.event-item button{border:0;border-radius:8px;background:#4b5563;padding:7px}
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.month-grid button{border:1px solid #4b5563;border-radius:9px;background:#111827;padding:11px 4px}
.rate-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:7px}
.rate-row label{font-size:10px;color:#d1d5db}
.backup{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.backup label,.backup button{display:flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:#374151;padding:9px;font-weight:800}
.backup input{display:none}
@media(max-width:480px){.panel{padding-left:4px;padding-right:4px}.summary{flex-basis:145px}}

/* カレンダーの見えている四隅を確実に角丸にする */
#planPanel .calendar,
#salaryPanel .calendar{
  border-radius:18px !important;
  overflow:hidden !important;
  border:1px solid #374151 !important;
  isolation:isolate;
}
#planPanel .cal-head,
#salaryPanel .cal-head{
  border-radius:17px 17px 0 0 !important;
}
#planPanel .grid,
#salaryPanel .grid{
  border-radius:0 0 17px 17px !important;
  overflow:hidden !important;
}
#planPanel .grid > :nth-last-child(7),
#salaryPanel .grid > :nth-last-child(7){
  border-bottom-left-radius:17px !important;
}
#planPanel .grid > :last-child,
#salaryPanel .grid > :last-child{
  border-bottom-right-radius:17px !important;
}


/* 操作中の拡大を抑止 */
html,body{touch-action:pan-x !important;-webkit-text-size-adjust:100% !important}

/* 予定カレンダー：予定を帯表示 */
#planPanel .day{padding:20px 4px 3px !important}
#planPanel .entry{
  display:flex !important;
  flex-direction:column !important;
  justify-content:center !important;
  width:100% !important;
  min-width:0 !important;
  min-height:27px !important;
  margin:2px 0 0 !important;
  padding:3px 4px !important;
  border-left:2px solid #7dd3fc !important;
  border-radius:4px !important;
  background:#365b86 !important;
  color:#fff !important;
  overflow:hidden !important;
  white-space:normal !important;
  line-height:1.05 !important;
}
#planPanel .entry strong{
  display:block !important;
  width:100% !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
  white-space:nowrap !important;
  font-size:8px !important;
  line-height:1.05 !important;
}
#planPanel .entry .entry-time{
  display:block !important;
  width:100% !important;
  font-size:7px !important;
  line-height:1.1 !important;
  white-space:nowrap !important;
  letter-spacing:-.25px !important;
  transform:scaleX(.88);
  transform-origin:left center;
  width:113.6% !important;
}

/* 給与カレンダー：日額をセル内に表示 */
#salaryPanel .day-pay{
  display:block;
  margin-top:2px;
  font-size:8px;
  font-weight:800;
  color:#d1d5db;
  white-space:nowrap;
}


/* 復元機能：月合計・給料日・勉強会終了時刻・詳細タイムライン */
.month-total{
  flex:0 0 auto;
  padding:5px 8px;
  border-top:1px solid #374151;
  background:#1f2937;
  text-align:right;
  font-size:11px;
  font-weight:800;
}
.payday-badge{
  position:absolute;
  top:4px;
  right:4px;
  padding:1px 3px;
  border-radius:4px;
  background:#374151;
  font-size:7px;
  font-weight:900;
  color:#f9fafb;
}
.study-end{
  font-size:11px;
  color:#cbd5e1;
  white-space:nowrap;
}
.detail-timeline{
  display:grid;
  grid-template-columns:34px minmax(0,1fr);
  height:360px;
  margin:10px 0 12px;
  border:1px solid #374151;
  border-radius:12px;
  overflow:hidden;
  background:#111827;
}
.detail-hours{position:relative;border-right:1px solid #374151;color:#9ca3af;font-size:8px}
.detail-hours span{position:absolute;right:4px;transform:translateY(-50%)}
.detail-hours span:first-child{top:0;transform:none}
.detail-hours span:last-child{bottom:0;transform:none}
.detail-track{
  position:relative;
  min-width:0;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(8.333333% - 1px),#263244 calc(8.333333% - 1px),#263244 8.333333%);
}
.detail-band{
  position:absolute;
  left:4px;
  right:4px;
  min-height:22px;
  padding:3px 5px;
  border-left:3px solid #7dd3fc;
  border-radius:5px;
  background:#365b86;
  color:#fff;
  overflow:hidden;
  font-size:9px;
  line-height:1.15;
}
.detail-band strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-band span{display:block;font-size:8px;white-space:nowrap}
.rate-row{
  grid-template-columns:1.15fr .8fr .8fr .8fr auto !important;
  align-items:end;
}
.rate-delete{
  border:0;
  border-radius:8px;
  background:#7f1d1d;
  color:#fff;
  padding:8px;
  font-weight:800;
}
@media(max-width:480px){
  .rate-row{grid-template-columns:1fr 1fr !important}
  .rate-delete{grid-column:1/-1}
}


/* 10 requested fixes */
html,body{width:100%;max-width:100%;height:100%;overflow:hidden!important;overscroll-behavior:none!important}
.wrap,.pager,.panel{max-width:100vw!important;overscroll-behavior:none!important}
.pager{overscroll-behavior-x:none!important;scroll-snap-stop:always!important}
button,.day,.month,.slot{touch-action:manipulation!important;-webkit-tap-highlight-color:transparent}

/* calendar event band */
#planPanel .day{padding:18px 3px 2px!important}
#planPanel .entry{height:auto!important;min-height:0!important;padding:3px!important;overflow:hidden!important}
#planPanel .entry-time{font-size:6.3px!important;line-height:1.05!important;letter-spacing:-.35px!important;transform:none!important;width:100%!important;overflow:visible!important}
#planPanel .entry-memo{display:block!important;margin-top:2px!important;padding-top:2px!important;border-top:1px solid rgba(255,255,255,.2);font-size:6.2px!important;line-height:1.1!important;white-space:normal!important;overflow-wrap:anywhere!important;color:#e5e7eb!important}

/* compact time controls */
.study-fields{grid-template-columns:66px 90px minmax(0,1fr)!important;gap:5px!important}
#studyHours,#studyStart{width:100%!important;min-width:0!important;height:34px!important;padding:3px 5px!important;font-size:16px!important}
.time-row{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:7px!important}
.time-row label,.time-row input{min-width:0!important;width:100%!important;box-sizing:border-box!important}
.time-row input{height:36px!important;padding:3px 5px!important;font-size:16px!important}

/* edit/delete side by side */
.event-actions{display:flex!important;gap:6px!important}
.event-delete-inline{background:#7f1d1d!important;color:#fff!important;border:0!important;border-radius:8px!important;padding:7px 9px!important;font-weight:800!important}

/* larger monthly salary summary */
.month-total{padding:9px 10px!important;text-align:left!important}
.total-main{font-size:17px!important;font-weight:900!important}
.total-breakdown{margin-top:3px;font-size:11px!important;font-weight:700!important;color:#cbd5e1!important}


/* latest control sizing/layout fixes */
.actions{display:flex!important;justify-content:flex-end!important;gap:8px!important}
.actions button{flex:0 0 auto!important;min-width:72px!important}

/* compact start/end controls */
.time-row{
  grid-template-columns:116px 176px!important;
  justify-content:start!important;
  align-items:end!important;
  gap:8px!important;
}
.time-row label{width:auto!important}
.time-row input[type="time"]{
  width:116px!important;max-width:116px!important;height:34px!important;
  padding:2px 4px!important;font-size:16px!important;
}
.end-time-wrap{display:flex;align-items:center;gap:5px;min-width:0}
#unsetEnd{
  flex:0 0 auto;width:54px;height:34px;padding:0 6px;
  border:1px solid #4b5563;border-radius:8px;background:#374151;color:#fff;font-weight:800;
}

/* study fields cannot overlap */
.study-fields{
  grid-template-columns:64px 116px 92px!important;
  justify-content:start!important;align-items:center!important;gap:7px!important;
}
#studyHours{width:64px!important;max-width:64px!important}
#studyStart{width:116px!important;max-width:116px!important}
#studyEnd{width:92px!important;min-width:92px!important;margin:0!important;overflow:hidden!important;font-size:10px!important}

/* overlapping timeline events are horizontally staggered */
.detail-track{overflow:hidden!important}
.detail-band{right:auto!important;box-sizing:border-box!important}


.hhmm-input{
  width:82px!important;max-width:82px!important;height:34px!important;
  padding:3px 7px!important;font-size:16px!important;letter-spacing:.6px!important;
  font-variant-numeric:tabular-nums;
}
.time-row{grid-template-columns:92px 148px!important}
.end-time-wrap{gap:5px!important}


/* 下部の予定一覧：3件まではそのまま表示、4件以上は縦スクロール */
#summary{
  height:auto!important;
  min-height:145px!important;
  max-height:none!important;
  overflow:hidden!important;
}
#summary .summary-title{
  font-size:15px!important;
  line-height:1.2!important;
  margin-bottom:5px!important;
}
#summary .summary-list{
  max-height:108px!important; /* 約3件分 */
  overflow-y:auto!important;
  overflow-x:hidden!important;
  overscroll-behavior:contain!important;
  -webkit-overflow-scrolling:touch;
}
#summary .summary-row{
  min-height:36px!important;
  padding:5px 2px!important;
  font-size:13px!important;
  line-height:1.2!important;
}
#summary .summary-time{
  font-size:12px!important;
  font-weight:800!important;
  min-width:88px!important;
}
#summary .summary-name{
  font-size:13px!important;
  font-weight:800!important;
  min-width:0!important;
}
#summary .summary-name small{
  font-size:11px!important;
  line-height:1.15!important;
}


#summary{height:auto!important;min-height:0!important;overflow:hidden!important}
#summary .summary-title{font-size:14px!important;line-height:1.2!important;padding-bottom:5px!important}
#summary .summary-list{max-height:126px!important;overflow-y:auto!important;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch}
#summary .summary-row{min-height:42px!important;padding:5px 2px!important;font-size:13px!important;line-height:1.18!important;align-items:flex-start!important}
#summary .summary-time{font-size:12px!important;line-height:1.2!important;min-width:88px!important}
#summary .summary-name{font-size:13px!important;line-height:1.2!important;min-width:0!important}
#summary .summary-name small{font-size:11px!important;line-height:1.15!important}
.detail-band{padding:2px 4px!important;line-height:1.05!important}
.detail-band strong{font-size:clamp(9px,2.7vw,12px)!important;line-height:1.05!important}
.detail-band span{font-size:clamp(8px,2.35vw,11px)!important;line-height:1.05!important}

/* Keep vertical lists usable while the month grid owns horizontal dragging. */
html,body,.pager{touch-action:pan-x pan-y!important}
.month-viewport{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none!important;overscroll-behavior:contain!important}
.month-viewport .grid{height:100%;width:100%;touch-action:none!important}
.month-viewport .day{touch-action:none!important}
.month-preview{position:absolute!important;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="wrap"><main class="pager" id="pager">
<section class="panel" id="planPanel">
<div class="panel-title"><h1>予定カレンダー</h1><button class="top-settings" type="button">設定</button></div>
<div class="calendar card">
<div class="cal-head"><button class="nav" id="planPrev">‹</button><button class="month" id="planMonth"></button><button class="nav" id="planNext">›</button></div>
<div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
<div class="grid" id="planGrid"></div>
</div>
<div class="summary card" id="summary"><div class="summary-title">日付を選択</div><div class="summary-empty">日付を1回押すと、その日の予定を表示します</div></div>
</section>

<section class="panel" id="salaryPanel">
<div class="panel-title"><h1>給与カレンダー</h1><button class="top-settings" type="button">設定</button></div>
<div class="salary-calendar calendar card">
<div class="cal-head"><button class="nav" id="salPrev">‹</button><button class="month" id="salMonth"></button><button class="nav" id="salNext">›</button></div>
<div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
<div class="grid" id="salGrid"></div>
<div class="month-total" id="monthTotal">月合計 0円</div>
</div>
<div class="controls card">
<div class="selected-date" id="selectedDate">日付を選択</div>
<div class="slot-grid" id="slotGrid"></div>
<div class="study-row"><button class="study-toggle" id="studyToggle">勉強会</button><div class="study-fields" id="studyFields">
<input id="studyHours" type="number" inputmode="decimal" min="0.5" step="0.5" placeholder="時間">
<input id="studyStart" type="time" step="300">
<div class="study-end" id="studyEnd">終了 --:--</div>
</div></div>
<div class="preview"><small>この日の給与</small><strong id="dayPay">0円</strong></div>
<div class="actions"><button class="secondary" id="clearDay">クリア</button><button class="primary" id="saveDay">保存</button></div>
</div>
</section>
</main></div>

<div class="backdrop" id="planDetail"><div class="modal">
<div class="modal-head"><div class="modal-title" id="detailDate"></div><button class="close" data-close="planDetail">×</button></div>
<div id="autoInfo"></div>
<div class="detail-timeline" id="detailTimeline"></div>
<div class="event-list" id="eventList"></div>
<button class="primary" id="addEvent" style="width:100%">＋予定を追加</button>
<div id="memoPreview" class="summary-memo"></div>
</div></div>

<div class="backdrop" id="eventEditor"><div class="modal">
<div class="modal-head"><div class="modal-title" id="editorTitle">予定を追加</div><button class="close" data-close="eventEditor">×</button></div>
<div class="form">
<label>予定名<input id="eventName" type="text"></label>
<div class="time-row"><label>開始<input id="eventStart" class="hhmm-input" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="1700"></label><label>終了<div class="end-time-wrap"><input id="eventEnd" class="hhmm-input" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="2130"><button type="button" id="unsetEnd">未定</button></div></label></div>
<label>メモ<textarea id="eventMemo" maxlength="120" placeholder="120文字まで"></textarea></label>
<div class="actions"><button class="danger" id="deleteEvent">削除</button><button class="primary" id="saveEvent">保存</button></div>
</div></div></div>

<div class="backdrop" id="monthPicker"><div class="modal">
<div class="modal-head"><button class="nav" id="yearPrev">‹</button><div class="modal-title" id="pickerYear"></div><button class="nav" id="yearNext">›</button></div>
<div class="month-grid" id="monthGrid"></div>
</div></div>

<div class="backdrop" id="settingsModal"><div class="modal">
<div class="modal-head"><div class="modal-title">給与単価の設定</div><button class="close" data-close="settingsModal">×</button></div>
<div id="rateRows"></div><button class="secondary" id="addRate" style="width:100%">＋単価を追加</button>
<div class="backup"><button id="exportBtn">バックアップ</button><label>復元<input type="file" id="importFile" accept=".json,application/json"></label></div>
</div></div>

<script>
const KEY="juku_salary_slots_v1", RATE_KEY="juku_salary_rates_v1", STUDY_KEY="salary_calendar_study_v1", PLAN_KEY="salary_calendar_plans_v1";
const SLOT_ORDER=["X","Y","Z","A","B","C","D"];
const SLOT_TIMES={X:["09:00","10:30"],Y:["10:35","12:05"],Z:["12:10","13:40"],A:["14:55","16:25"],B:["16:30","18:00"],C:["18:05","19:35"],D:["19:40","21:10"]};
let shifts=load(KEY,{}), studies=load(STUDY_KEY,{}), plans=load(PLAN_KEY,{}), rates=load(RATE_KEY,[]);
if(!Array.isArray(rates)||!rates.length) rates=[{from:"2000-01-01",lesson:2026,daily:513,transport:420}];
let planView=new Date(), salView=new Date(), selectedPlan="", selectedSalary="", editingEvent=null, pickerTarget="plan", pickerYear=new Date().getFullYear();

function load(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function pad(n){return String(n).padStart(2,"0")}
function keyOf(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function yen(n){return Math.round(n).toLocaleString("ja-JP")+"円"}
function getSlots(k){return Array.isArray(shifts[k])?shifts[k]:[]}
function study(k){let v=studies[k];if(typeof v==="number")return {hours:v,start:"",end:""};return v&&typeof v==="object"?{hours:Number(v.hours)||0,start:v.start||"",end:v.end||""}:{hours:0,start:"",end:""}}
function plan(k){let v=plans[k];if(!v||typeof v!=="object")return {events:[]};let events=[];if(Array.isArray(v.events)){events=v.events.map((e,i)=>({id:String(e.id||`${k}-${i}`),title:String(e.title||""),start:String(e.start||""),end:String(e.end||""),memo:String(e.memo??(i===0?(v.memo||""):""))}))}else if(v.title||v.time){events=[{id:`${k}-legacy`,title:String(v.title||""),start:String(v.time||""),end:"",memo:String(v.memo||"")}]}return {events}}
function mins(t){if(!/^\d{1,2}:\d{2}$/.test(t||""))return null;let [h,m]=t.split(":").map(Number);return h*60+m}
function addMinutes(t,n){let m=mins(t);if(m==null)return "";m=Math.min(1439,m+n);return `${pad(Math.floor(m/60))}:${pad(m%60)}`}
function slotRange(slots){if(!slots.length)return "";let s=[...slots].sort((a,b)=>mins(SLOT_TIMES[a]?.[0])-mins(SLOT_TIMES[b]?.[0]));return `${SLOT_TIMES[s[0]][0]}-${SLOT_TIMES[s.at(-1)][1]}`}
function studyRange(k){let s=study(k);if(!s.hours||!s.start)return "";return `${s.start}-${s.end||addMinutes(s.start,s.hours*60)}`}
function items(k){let a=[],sl=getSlots(k);if(sl.length){let r=slotRange(sl);a.push({id:"auto-juku",name:"塾",time:r,start:r.split("-")[0],end:r.split("-")[1],memo:"",auto:true})}let st=study(k);if(st.hours){let r=studyRange(k)||`時間未定（${st.hours}h）`;a.push({id:"auto-study",name:"勉強会",time:r,start:st.start,end:st.end||addMinutes(st.start,st.hours*60),memo:"",auto:true})}for(let e of plan(k).events)a.push({id:e.id,name:e.title||"予定",time:e.start?`${e.start}-${e.end||"未定"}`:"時間未定",start:e.start,end:e.end,memo:e.memo||"",auto:false});return a.sort((x,y)=>(x.start||"99:99").localeCompare(y.start||"99:99"))}
function rateFor(k){return [...rates].sort((a,b)=>String(a.from).localeCompare(String(b.from))).filter(r=>!r.from||r.from<=k).at(-1)||rates[0]}
function dayPay(k){let r=rateFor(k),sl=getSlots(k),st=study(k);return sl.length*(Number(r.lesson)||0)+(sl.length?(Number(r.daily)||0)+(Number(r.transport)||0):0)+(st.hours?st.hours*1500+420:0)}
function monthPay(y,m){let sum=0,last=new Date(y,m+1,0).getDate();for(let d=1;d<=last;d++)sum+=dayPay(keyOf(y,m,d));return sum}

function holidaySet(y){
 let s=new Set(),add=(m,d)=>s.add(keyOf(y,m-1,d)),nth=(m,w,n)=>{let d=1,c=0;while(d<=31){let dt=new Date(y,m-1,d);if(dt.getMonth()!=m-1)break;if(dt.getDay()==w&&++c==n)return d;d++}};
 add(1,1);add(2,11);add(2,23);add(4,29);add(5,3);add(5,4);add(5,5);add(8,11);add(11,3);add(11,23);
 add(1,nth(1,1,2));add(7,nth(7,1,3));add(9,nth(9,1,3));add(10,nth(10,1,2));
 add(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)));
 add(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)));
 for(let k of [...s]){let [Y,M,D]=k.split("-").map(Number),dt=new Date(Y,M-1,D);if(dt.getDay()==0){do{dt.setDate(dt.getDate()+1)}while(s.has(keyOf(dt.getFullYear(),dt.getMonth(),dt.getDate())));s.add(keyOf(dt.getFullYear(),dt.getMonth(),dt.getDate()))}}
 return s
}
function dayClass(y,m,d){let dt=new Date(y,m,d),k=keyOf(y,m,d);if(dt.getDay()==0||holidaySet(y).has(k))return "holiday";if(dt.getDay()==6)return "saturday";return ""}

function renderGrid(grid,view,kind){
 let y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),today=new Date();grid.innerHTML="";
 for(let i=0;i<42;i++){
   let d=i-first+1;
   if(d<1||d>last){let b=document.createElement("div");b.className="blank";grid.appendChild(b);continue}
   let k=keyOf(y,m,d),b=document.createElement("button");b.className="day "+dayClass(y,m,d);b.type="button";
   if(today.getFullYear()==y&&today.getMonth()==m&&today.getDate()==d)b.classList.add("today");
   if((kind=="plan"?selectedPlan:selectedSalary)==k)b.classList.add("selected");
   let content="";
   if(kind=="plan"){content=items(k).map(x=>`<span class="entry"><strong>${esc(x.name)}</strong><span class="entry-time">${esc(x.time)}</span>${x.memo?`<span class="entry-memo">${esc(x.memo)}</span>`:""}</span>`).join("")}
   else {
     let sl=getSlots(k),st=study(k),pay=dayPay(k);
     content=(d===15?'<span class="payday-badge">給料日</span>':"")+
       (sl.length?`<span class="entry"><strong>${esc(sl.join(""))}</strong></span>`:"")+
       (st.hours?'<span class="entry"><strong>勉強会</strong></span>':"")+
       (pay>0?`<span class="day-pay">${yen(pay)}</span>`:"");
   }
   b.innerHTML=`<span class="daynum">${d}</span>${content}`;
   b.onclick=()=>kind=="plan"?clickPlan(k):clickSalary(k);grid.appendChild(b)
 }
}
function renderPlan(){planMonth.textContent=`${planView.getFullYear()}年${planView.getMonth()+1}月`;renderGrid(planGrid,planView,"plan");renderSummary()}
function monthBreakdown(y,m){let juku=0,studyPay=0,last=new Date(y,m+1,0).getDate();for(let d=1;d<=last;d++){let k=keyOf(y,m,d),r=rateFor(k),sl=getSlots(k),st=study(k);if(sl.length)juku+=sl.length*(Number(r.lesson)||0)+(Number(r.daily)||0)+(Number(r.transport)||0);if(st.hours)studyPay+=st.hours*1500+420}return {juku,study:studyPay,total:juku+studyPay}}
function renderSalary(){
 salMonth.textContent=`${salView.getFullYear()}年${salView.getMonth()+1}月`;
 renderGrid(salGrid,salView,"salary");
 let mb=monthBreakdown(salView.getFullYear(),salView.getMonth());monthTotal.innerHTML=`<div class="total-main">月合計 ${yen(mb.total)}</div><div class="total-breakdown">バイト ${yen(mb.juku)} ／ 勉強会 ${yen(mb.study)}</div>`;
 if(selectedSalary)loadSalaryDay()
}
function renderSummary(){
 if(!selectedPlan){summary.innerHTML='<div class="summary-title">日付を選択</div><div class="summary-empty">日付を1回押すと、その日の予定を表示します</div>';return}
 let [y,m,d]=selectedPlan.split("-").map(Number),w=["日","月","火","水","木","金","土"][new Date(y,m-1,d).getDay()],a=items(selectedPlan);
 summary.innerHTML=`<div class="summary-title">${m}月${d}日（${w}）</div>${a.length?`<div class="summary-list">${a.map(x=>`<div class="summary-row"><span class="summary-time">${esc(x.time)}</span><span class="summary-name">${esc(x.name)}${x.memo?`<br><small>${esc(x.memo)}</small>`:""}</span></div>`).join("")}</div>`:'<div class="summary-empty">予定なし</div>'}`
}
function clickPlan(k){if(selectedPlan==k)openPlanDetail();else{selectedPlan=k;renderPlan()}}
function clickSalary(k){selectedSalary=k;renderSalary()}
function loadSalaryDay(){selectedDate.textContent=selectedSalary.replaceAll("-","/");let sl=getSlots(selectedSalary);document.querySelectorAll(".slot").forEach(b=>b.classList.toggle("active",sl.includes(b.dataset.slot)));let st=study(selectedSalary);studyToggle.classList.toggle("active",st.hours>0);studyFields.classList.toggle("active",st.hours>0);studyHours.value=st.hours||"";
studyStart.value=st.start||"";
updateStudyEnd();
dayPayEl.textContent=yen(dayPay(selectedSalary))}

function hhmmToTime(v){
 const s=String(v||"").replace(/\D/g,"").slice(0,4);
 if(s.length!==4)return "";
 const h=Number(s.slice(0,2)),m=Number(s.slice(2));
 if(h>23||m>59)return "";
 return `${pad(h)}:${pad(m)}`;
}
function timeToHHMM(v){return /^\d{2}:\d{2}$/.test(v)?v.replace(":",""):""}
function setupHHMMInput(inp){
 inp.addEventListener("input",()=>{
   const digits=inp.value.replace(/\D/g,"").slice(0,4);
   if(inp.value!==digits)inp.value=digits;
 });
 inp.addEventListener("blur",()=>{
   const v=hhmmToTime(inp.value);
   if(v)inp.value=timeToHHMM(v);
 });
}
function roundTime5(v){
 if(!v||!/^\d{2}:\d{2}$/.test(v))return v;
 let [h,m]=v.split(":").map(Number),total=h*60+m;
 total=Math.round(total/5)*5;
 if(total>=1440)total=1435;
 return `${pad(Math.floor(total/60))}:${pad(total%60)}`;
}
function enforceFiveMinuteTimes(){
 document.querySelectorAll('input[type="time"]').forEach(inp=>{
   inp.step=300;
   const fix=()=>{const v=roundTime5(inp.value);if(v!==inp.value){inp.value=v;inp.dispatchEvent(new Event("input",{bubbles:true}))}};
   inp.addEventListener("change",fix);
   inp.addEventListener("blur",fix);
 });
}
function updateStudyEnd(){
 const h=Number(studyHours.value)||0,start=studyStart.value||"";
 studyEnd.textContent=`終了 ${h>0&&start?addMinutes(start,h*60):"--:--"}`;
}
function saveSalary(){if(!selectedSalary)return;let sl=[...document.querySelectorAll(".slot.active")].map(b=>b.dataset.slot);if(sl.length)shifts[selectedSalary]=sl;else delete shifts[selectedSalary];let h=Number(studyHours.value)||0;if(studyToggle.classList.contains("active")&&h>0){let start=studyStart.value||"";studies[selectedSalary]={hours:h,start,end:start?addMinutes(start,h*60):""}}else delete studies[selectedSalary];save(KEY,shifts);save(STUDY_KEY,studies);renderSalary();renderPlan()}
function clearSalary(){if(!selectedSalary)return;delete shifts[selectedSalary];delete studies[selectedSalary];save(KEY,shifts);save(STUDY_KEY,studies);renderSalary();renderPlan()}

function renderDetailTimeline(k){
 const a=items(k).filter(x=>mins(x.start)!=null).map(x=>{
   const s=mins(x.start);let e=mins(x.end);if(e==null||e<=s)e=Math.min(s+60,1440);
   return {...x,_s:s,_e:e,_lane:0,_lanes:1}
 }).sort((a,b)=>a._s-b._s||a._e-b._e);
 let active=[];
 for(const x of a){
   active=active.filter(y=>y._e>x._s);
   const used=new Set(active.map(y=>y._lane));let lane=0;while(used.has(lane))lane++;
   x._lane=lane;active.push(x);
   const count=Math.max(...active.map(y=>y._lane))+1;
   active.forEach(y=>y._lanes=Math.max(y._lanes,count));
 }
 let hours='<div class="detail-hours">';
 for(let h=0;h<=24;h+=2){const pos=(h/24)*100;hours+=`<span style="${h===0?'top:0;transform:none':h===24?'bottom:0;transform:none':`top:${pos}%`}">${pad(h)}:00</span>`}
 hours+='</div>';
 let bands=a.map(x=>{
   const top=(x._s/1440)*100,height=Math.max(((x._e-x._s)/1440)*100,1.5);
   const gap=3,width=`calc(${100/x._lanes}% - ${gap+4}px)`,left=`calc(${x._lane*(100/x._lanes)}% + ${4+x._lane*gap}px)`;
   return `<div class="detail-band" style="top:${top}%;height:${height}%;left:${left};width:${width}"><strong>${esc(x.name)}</strong><span>${esc(x.time)}</span>${x.memo?`<span>${esc(x.memo)}</span>`:""}</div>`
 }).join("");
 detailTimeline.innerHTML=hours+`<div class="detail-track">${bands}</div>`
}
function openPlanDetail(){let k=selectedPlan,p=plan(k);detailDate.textContent=k.replaceAll("-","/");renderDetailTimeline(k);let sl=getSlots(k),st=study(k);autoInfo.innerHTML=`<div class="summary-row"><span>塾</span><span>${sl.length?esc(slotRange(sl)):"なし"}</span></div><div class="summary-row"><span>勉強会</span><span>${st.hours?esc(studyRange(k)||st.hours+"時間"):"なし"}</span></div>`;eventList.innerHTML=p.events.length?p.events.sort((a,b)=>(a.start||"99").localeCompare(b.start||"99")).map(e=>`<div class="event-item"><div class="event-text"><strong>${esc(e.title||"予定")}</strong><br>${esc(e.start?`${e.start}-${e.end||"未定"}`:"時間未定")}${e.memo?`<br><small>${esc(e.memo)}</small>`:""}</div><div class="event-actions"><button class="event-delete-inline" data-del="${esc(e.id)}">削除</button><button data-edit="${esc(e.id)}">変更</button></div></div>`).join(""):'<div class="summary-empty">登録済み予定なし</div>';eventList.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));eventList.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteEventById(b.dataset.del));memoPreview.innerHTML="";open("planDetail")}
function openEditor(id=null){editingEvent=id;let p=plan(selectedPlan),e=id?p.events.find(x=>x.id==id):null;editorTitle.textContent=e?"予定を変更":"予定を追加";eventName.value=e?.title||"";eventStart.value=timeToHHMM(e?.start||"");eventEnd.value=timeToHHMM(e?.end||"");eventMemo.value=e?.memo||"";deleteEvent.style.visibility=e?"visible":"hidden";open("eventEditor")}
function saveEventFn(){
 if(!selectedPlan)return;
 const start=hhmmToTime(eventStart.value),end=eventEnd.value?hhmmToTime(eventEnd.value):"";
 if(!start){eventStart.focus();return}
 if(eventEnd.value&&!end){eventEnd.focus();return}
 let p=plan(selectedPlan),e={id:editingEvent||`${Date.now()}`,title:eventName.value.trim()||"予定",start,end,memo:eventMemo.value.slice(0,120)};
 if(editingEvent){let i=p.events.findIndex(x=>x.id==editingEvent);if(i>=0)p.events[i]=e}else p.events.push(e);
 plans[selectedPlan]=p;save(PLAN_KEY,plans);close("eventEditor");renderPlan();openPlanDetail()
}
function deleteEventById(id){let p=plan(selectedPlan);p.events=p.events.filter(x=>x.id!=id);plans[selectedPlan]=p;save(PLAN_KEY,plans);close("eventEditor");renderPlan();openPlanDetail()}
function deleteEventFn(){if(editingEvent)deleteEventById(editingEvent)}
function open(id){document.getElementById(id).classList.add("open")}function close(id){document.getElementById(id).classList.remove("open")}

function openMonth(kind){pickerTarget=kind;let v=kind=="plan"?planView:salView;pickerYear=v.getFullYear();renderPicker();open("monthPicker")}
function renderPicker(){pickerYearEl.textContent=pickerYear+"年";monthGrid.innerHTML="";for(let m=0;m<12;m++){let b=document.createElement("button");b.textContent=(m+1)+"月";b.onclick=()=>{if(pickerTarget=="plan")planView=new Date(pickerYear,m,1);else salView=new Date(pickerYear,m,1);close("monthPicker");renderPlan();renderSalary()};monthGrid.appendChild(b)}}
function renderRates(){
 rateRows.innerHTML=rates.map((r,i)=>`<div class="rate-row">
 <label>適用日<input data-i="${i}" data-k="from" type="date" value="${esc(r.from||"")}"></label>
 <label>1コマ<input data-i="${i}" data-k="lesson" type="number" value="${Number(r.lesson)||0}"></label>
 <label>日時手当<input data-i="${i}" data-k="daily" type="number" value="${Number(r.daily)||0}"></label>
 <label>交通費<input data-i="${i}" data-k="transport" type="number" value="${Number(r.transport)||0}"></label>
 <button class="rate-delete" data-delete-rate="${i}" type="button">削除</button>
 </div>`).join("");
 rateRows.querySelectorAll("input").forEach(x=>x.onchange=()=>{
   let i=+x.dataset.i,k=x.dataset.k;
   rates[i][k]=k=="from"?x.value:Number(x.value);
   save(RATE_KEY,rates);renderSalary()
 });
 rateRows.querySelectorAll("[data-delete-rate]").forEach(b=>b.onclick=()=>{
   if(rates.length<=1)return;
   rates.splice(Number(b.dataset.deleteRate),1);
   save(RATE_KEY,rates);renderRates();renderSalary()
 });
}
function exportData(){let blob=new Blob([JSON.stringify({version:5,shifts,rates,studies,plans},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="calendar-backup.json";a.click();URL.revokeObjectURL(a.href)}
async function importData(f){try{let j=JSON.parse(await f.text());if(j.shifts)shifts=j.shifts;if(j.rates)rates=j.rates;if(j.studies)studies=j.studies;if(j.plans)plans=j.plans;save(KEY,shifts);save(RATE_KEY,rates);save(STUDY_KEY,studies);save(PLAN_KEY,plans);renderPlan();renderSalary();alert("復元しました")}catch{alert("復元できませんでした")}}

const dayPayEl=document.getElementById("dayPay"),pickerYearEl=document.getElementById("pickerYear");
SLOT_ORDER.forEach(s=>{let b=document.createElement("button");b.className="slot";b.dataset.slot=s;b.textContent=s;b.onclick=()=>{b.classList.toggle("active");if(selectedSalary)dayPayEl.textContent=yen(dayPay(selectedSalary))};slotGrid.appendChild(b)});
planPrev.onclick=()=>{planView=new Date(planView.getFullYear(),planView.getMonth()-1,1);renderPlan()};planNext.onclick=()=>{planView=new Date(planView.getFullYear(),planView.getMonth()+1,1);renderPlan()};salPrev.onclick=()=>{salView=new Date(salView.getFullYear(),salView.getMonth()-1,1);renderSalary()};salNext.onclick=()=>{salView=new Date(salView.getFullYear(),salView.getMonth()+1,1);renderSalary()};
planMonth.onclick=()=>openMonth("plan");salMonth.onclick=()=>openMonth("salary");yearPrev.onclick=()=>{pickerYear--;renderPicker()};yearNext.onclick=()=>{pickerYear++;renderPicker()};
studyToggle.onclick=()=>{studyToggle.classList.toggle("active");studyFields.classList.toggle("active",studyToggle.classList.contains("active"))};
studyHours.oninput=()=>{
 let raw=studyHours.value.replace?.(/[^0-9.]/g,"") ?? studyHours.value;
 if(raw!==studyHours.value)studyHours.value=raw;
 updateStudyEnd();if(selectedSalary)dayPayEl.textContent=yen(dayPay(selectedSalary))
};
studyHours.onchange=()=>{let n=Number(studyHours.value);if(Number.isFinite(n)&&n>0)studyHours.value=(Math.round(n*2)/2).toString();updateStudyEnd()};
studyStart.oninput=updateStudyEnd;saveDay.onclick=saveSalary;clearDay.onclick=clearSalary;
addEvent.onclick=()=>openEditor();saveEvent.onclick=saveEventFn;deleteEvent.onclick=deleteEventFn;
unsetEnd.onclick=()=>{eventEnd.value="";};
document.querySelectorAll(".top-settings").forEach(b=>b.onclick=()=>{renderRates();open("settingsModal")});addRate.onclick=()=>{rates.push({from:new Date().toISOString().slice(0,10),lesson:2026,daily:513,transport:420});save(RATE_KEY,rates);renderRates()};
exportBtn.onclick=exportData;importFile.onchange=e=>e.target.files[0]&&importData(e.target.files[0]);
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>close(b.dataset.close));
document.querySelectorAll(".backdrop").forEach(b=>b.addEventListener("click",e=>{if(e.target===b)close(b.id)}));
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
pager.addEventListener("scrollend",()=>{if(pager.scrollLeft<pager.clientWidth*.5){shifts=load(KEY,{});studies=load(STUDY_KEY,{});renderPlan()}},{passive:true});pager.addEventListener("scroll",()=>{let max=Math.max(0,pager.scrollWidth-pager.clientWidth);if(pager.scrollLeft<0)pager.scrollLeft=0;else if(pager.scrollLeft>max)pager.scrollLeft=max},{passive:true});
function enableMonthSwipe(grid,kind){
 const viewport=document.createElement('div');
 viewport.className='month-viewport';
 grid.before(viewport);viewport.append(grid);
 let gesture=null,previous=null,next=null,busy=false,suppressUntil=0,wheelTotal=0,wheelTimer=null,wheelLocked=false;
 const view=()=>kind==='plan'?planView:salView;
 const shifted=n=>new Date(view().getFullYear(),view().getMonth()+n,1);

 function cleanupPreviews(){
   previous?.remove();next?.remove();previous=next=null;
   grid.style.transition='';grid.style.transform='';
 }
 function prepare(){
   if(previous||next)return;
   previous=document.createElement('div');next=document.createElement('div');
   for(const [preview,offset] of [[previous,-1],[next,1]]){
     preview.className='grid month-preview';preview.setAttribute('aria-hidden','true');
     renderGrid(preview,shifted(offset),kind);
     preview.querySelectorAll('button').forEach(button=>button.tabIndex=-1);
     viewport.append(preview);
   }
 }
 function position(x,animate=false){
   const width=viewport.clientWidth;
   for(const [element,offset] of [[previous,-width],[grid,0],[next,width]]){
     if(!element)continue;
     element.style.transition=animate?'transform 180ms ease-out':'none';
     element.style.transform=`translate3d(${x+offset}px,0,0)`;
   }
 }
 function finish(direction){
   if(busy)return;
   busy=true;suppressUntil=Date.now()+320;
   if(!previous||!next)prepare();
   position(-direction*viewport.clientWidth,true);
   setTimeout(()=>{
     if(direction){
       const date=shifted(direction);
       if(kind==='plan'){planView=date;renderPlan()}else{salView=date;renderSalary()}
     }
     cleanupPreviews();busy=false;
   },190);
 }
 viewport.addEventListener('pointerdown',event=>{
   if(busy||gesture||!event.isPrimary||event.button!==0)return;
   gesture={id:event.pointerId,x:event.clientX,y:event.clientY,dx:0,started:false};
 },{passive:true});

 window.addEventListener('pointermove',event=>{
   if(!gesture||event.pointerId!==gesture.id)return;
   const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;
   if(!gesture.started){
     if(Math.max(Math.abs(dx),Math.abs(dy))<7)return;
     if(Math.abs(dy)>Math.abs(dx)*1.15){gesture=null;return}
     gesture.started=true;prepare();
   }
   event.preventDefault();
   gesture.dx=Math.max(-viewport.clientWidth,Math.min(viewport.clientWidth,dx));
   position(gesture.dx);
 },{passive:false});

 function release(event,cancelled=false){
   if(!gesture||event.pointerId!==gesture.id)return;
   const current=gesture;gesture=null;
   if(!current.started){cleanupPreviews();return}
   const threshold=Math.min(60,viewport.clientWidth*.16);
   const direction=!cancelled&&Math.abs(current.dx)>threshold?(current.dx<0?1:-1):0;
   finish(direction);
 }
 window.addEventListener('pointerup',event=>release(event),{passive:true});
 window.addEventListener('pointercancel',event=>release(event,false),{passive:true});

 viewport.addEventListener('click',event=>{
   if(Date.now()<suppressUntil){event.preventDefault();event.stopImmediatePropagation()}
 },true);

 viewport.addEventListener('wheel',event=>{
   if(event.ctrlKey||Math.abs(event.deltaX)<=Math.abs(event.deltaY))return;
   event.preventDefault();event.stopPropagation();
   clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{wheelTotal=0;wheelLocked=false},160);
   if(busy||gesture||wheelLocked)return;
   wheelTotal+=event.deltaX*(event.deltaMode===1?16:event.deltaMode===2?viewport.clientWidth:1);
   if(Math.abs(wheelTotal)>45){
     const direction=wheelTotal>0?1:-1;
     wheelTotal=0;wheelLocked=true;prepare();position(0);viewport.offsetWidth;finish(direction);
   }
 },{passive:false});
}

enableMonthSwipe(planGrid,'plan');enableMonthSwipe(salGrid,'salary');
renderPlan();renderSalary();
</script>
</body></html>
