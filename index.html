<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>塾バイト給料カレンダー</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#111}
.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}
h1{font-size:24px;margin:6px 0 14px}
.summary{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.big{font-size:30px;font-weight:800}
.sub{font-size:13px;color:#666}
.calendar{background:#fff;border-radius:16px;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;padding:14px}
.head button{border:0;background:#eef0f4;width:42px;height:42px;border-radius:12px;font-size:22px;font-weight:700}
.month{font-size:18px;font-weight:800}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.week div{text-align:center;padding:8px 0;font-size:12px;color:#666;border-top:1px solid #eee}
.day,.blank{min-height:82px;border:0;border-top:1px solid #eee;border-right:1px solid #eee;background:#fff;text-align:left;padding:7px}
.day:nth-child(7n),.blank:nth-child(7n){border-right:0}
.blank{background:#fafafa}
.daynum{font-weight:700}
.entry{display:block;font-size:11px;margin-top:8px;font-weight:700;line-height:1.4}
.controls{background:#fff;border-radius:16px;padding:16px;margin-top:14px}
.controls button{font-size:18px;padding:10px 15px;border:0;border-radius:12px;margin-right:8px}
.save{background:#111;color:#fff}
.clear{background:#eee}
#selected{font-weight:700;margin-bottom:10px}
.note{font-size:12px;color:#666;margin-top:10px;line-height:1.5}
.today .daynum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#111;color:#fff}
</style>
</head>
<body>
<div class="wrap">
<h1>塾バイト給料カレンダー</h1>

<div class="summary">
<div class="sub" id="summaryLabel">今月の給料見込み</div>
<div class="big" id="total">0円</div>
<div class="sub"><span id="daysCount">0</span>日勤務・<span id="lessonCount">0</span>コマ</div>
<div class="sub" style="margin-top:8px;font-weight:700">給料日：毎月15日</div>
</div>

<div class="calendar">
<div class="head">
<button onclick="moveMonth(-1)">‹</button>
<div class="month" id="monthTitle"></div>
<button onclick="moveMonth(1)">›</button>
</div>
<div class="week">
<div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
</div>
<div class="grid" id="grid"></div>
</div>

<div class="controls">
<div id="selected">日付をタップ</div>
<div>
<button onclick="change(-1)">−</button>
<strong id="count">0コマ</strong>
<button onclick="change(1)">＋</button>
</div>
<div style="margin-top:12px">
<button class="save" onclick="save()">保存</button>
<button class="clear" onclick="clearDay()">勤務なし</button>
</div>
<div class="note">1コマ 2,026円 ＋ 出勤日ごとに日次手当513円＋交通費420円<br>登録内容はブラウザ内に保存されます</div>
</div>
</div>

<script>
const PAY = 2026;
const FIX = 513 + 420;
const KEY = "juku_salary_all_months_v1";

let data = JSON.parse(localStorage.getItem(KEY) || "{}");
let view = new Date();
view = new Date(view.getFullYear(), view.getMonth(), 1);

let selected = null;
let count = 0;

function money(n){ return n.toLocaleString("ja-JP") + "円"; }
function pad(n){ return String(n).padStart(2,"0"); }
function keyOf(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function dayPay(c){ return c > 0 ? PAY * c + FIX : 0; }

function renderCalendar(){
  const y = view.getFullYear();
  const m = view.getMonth();
  document.getElementById("monthTitle").textContent = `${y}年${m+1}月`;
  document.getElementById("summaryLabel").textContent = `${y}年${m+1}月の給料見込み`;

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const firstDay = new Date(y,m,1).getDay();
  const lastDate = new Date(y,m+1,0).getDate();

  for(let i=0;i<firstDay;i++){
    const b = document.createElement("div");
    b.className = "blank";
    grid.appendChild(b);
  }

  const today = new Date();

  for(let d=1; d<=lastDate; d++){
    const key = keyOf(y,m,d);
    const c = Number(data[key] || 0);
    const btn = document.createElement("button");
    btn.className = "day";
    if(today.getFullYear()===y && today.getMonth()===m && today.getDate()===d){
      btn.classList.add("today");
    }
    btn.dataset.date = key;
    btn.innerHTML = `<span class="daynum">${d}</span><span class="entry">${d===15 ? `給料日${c>0 ? "<br>" : ""}` : ""}${c>0 ? `${c}コマ<br>${money(dayPay(c))}` : ""}</span>`;
    btn.onclick = () => selectDay(key);
    grid.appendChild(btn);
  }

  const used = firstDay + lastDate;
  const trailing = (7 - (used % 7)) % 7;
  for(let i=0;i<trailing;i++){
    const b = document.createElement("div");
    b.className = "blank";
    grid.appendChild(b);
  }

  renderSummary();
}

function renderSummary(){
  const y = view.getFullYear();
  const m = view.getMonth();
  const prefix = `${y}-${pad(m+1)}-`;

  let total=0, days=0, lessons=0;

  for(const [date,cRaw] of Object.entries(data)){
    if(!date.startsWith(prefix)) continue;
    const c = Number(cRaw);
    if(c > 0){
      days++;
      lessons += c;
      total += dayPay(c);
    }
  }

  document.getElementById("total").textContent = money(total);
  document.getElementById("daysCount").textContent = days;
  document.getElementById("lessonCount").textContent = lessons;
}

function selectDay(key){
  selected = key;
  count = Number(data[selected] || 0);
  document.getElementById("selected").textContent = selected.replaceAll("-","/") + " を編集中";
  document.getElementById("count").textContent = count + "コマ";
}

function change(n){
  if(!selected) return;
  count = Math.max(0, count+n);
  document.getElementById("count").textContent = count + "コマ";
}

function save(){
  if(!selected) return;
  if(count > 0) data[selected] = count;
  else delete data[selected];
  localStorage.setItem(KEY, JSON.stringify(data));
  renderCalendar();
}

function clearDay(){
  if(!selected) return;
  delete data[selected];
  count = 0;
  localStorage.setItem(KEY, JSON.stringify(data));
  document.getElementById("count").textContent = "0コマ";
  renderCalendar();
}

function moveMonth(diff){
  view = new Date(view.getFullYear(), view.getMonth()+diff, 1);
  selected = null;
  count = 0;
  document.getElementById("selected").textContent = "日付をタップ";
  document.getElementById("count").textContent = "0コマ";
  renderCalendar();
}

renderCalendar();
</script>
</body>
</html>
